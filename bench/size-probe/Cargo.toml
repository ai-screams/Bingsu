# Binary size probe for the three dependency combinations (spec section 8
# capacity table). Not a workspace member; versions are pinned by its lock.
[package]
name = "bingsu-size-probe"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace]

[features]
regex = ["dep:regex"]
yaml-json = ["dep:serde-saphyr", "dep:serde_json"]

[dependencies]
gix = { version = "=0.88.0", default-features = false, features = ["status", "sha1", "max-performance-safe"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
unicode-segmentation = "1.13"
unicode-width = "0.2"
regex = { version = "1.13", optional = true }
serde-saphyr = { version = "1.3", optional = true }
serde_json = { version = "1", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
