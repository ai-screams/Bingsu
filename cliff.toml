# git-cliff configuration: generates CHANGELOG.md from Conventional Commits.
# https://git-cliff.org/docs/configuration
#
#   git cliff --unreleased --prepend CHANGELOG.md   # add unreleased changes
#   git cliff --tag v0.1.0 -o CHANGELOG.md          # regenerate for a release

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""

body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}**BREAKING** {% endif %}\
            {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""

footer = """
{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous and release.previous.version -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                https://github.com/ai-screams/Bingsu/compare/{{ release.previous.version }}...{{ release.version }}
        {% endif -%}
    {% elif release.previous and release.previous.version -%}
        [Unreleased]: https://github.com/ai-screams/Bingsu/compare/{{ release.previous.version }}...HEAD
    {% endif -%}
{% endfor %}
<!-- generated by git-cliff -->
"""

trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
topo_order = false
sort_commits = "newest"

# Squash merges end the subject line with "(#N)"; (?m) anchors $ to that line,
# not to the end of the body. Turn it into a pull request link here, so the changelog needs no GitHub API token and never shows the number twice.
commit_preprocessors = [
    { pattern = '(?m)[ \t]*\(#([0-9]+)\)$', replace = " ([#${1}](https://github.com/ai-screams/Bingsu/pull/${1}))" },
]

commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Changed" },
    { message = "^style", group = "Changed" },
    { message = "^doc", group = "Documentation" },
    { message = "^revert", group = "Reverted" },
    { message = "^build", group = "Build" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps\\)", group = "Dependencies" },
    { message = "^chore", group = "Miscellaneous" },
    { message = "^test", skip = true },
    { message = "^ci", skip = true },
]

tag_pattern = "v[0-9].*"
