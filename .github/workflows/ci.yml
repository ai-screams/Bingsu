name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ACTIONLINT_VERSION: 1.7.12
  WASMTIME_VERSION: v49.0.2

jobs:
  # Rust jobs are skipped until the Cargo workspace exists.
  detect:
    name: Detect project
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.check.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: |
          if [ -f Cargo.toml ]; then echo "rust=true" >> "$GITHUB_OUTPUT"; else echo "rust=false" >> "$GITHUB_OUTPUT"; fi

  workflows:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (pinned release, checksum verified)
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          file="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "${base}/${file}"
          curl -fsSLO "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " ${file}\$" "actionlint_${ACTIONLINT_VERSION}_checksums.txt" | sha256sum --check
          tar -xzf "${file}" actionlint
      - name: Run actionlint
        run: ./actionlint -color

  collector-probes:
    name: Collector experiments (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            probe: X-02
          - os: ubuntu-24.04-arm
            probe: X-02
          - os: macos-latest
            probe: X-32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the acceptance parser tests
        run: |
          python3 -m venv "$RUNNER_TEMP/probe-tests"
          "$RUNNER_TEMP/probe-tests/bin/python" -m pip install --require-hashes --only-binary=:all: -r tests/shell/requirements.txt
      - name: Required ledger cells and evidence mutations
        run: |
          set -o pipefail
          "$RUNNER_TEMP/probe-tests/bin/python" -m pytest bench/tests/test_collector_probes.py -q -rA -p no:cacheprovider | tee "$RUNNER_TEMP/probe-tests.txt"
          grep -F 'PASSED bench/tests/test_collector_probes.py::test_ledger_requires_every_acceptance_cell' "$RUNNER_TEMP/probe-tests.txt"
      # Only read the default sysctl value. Other values require disposable VMs.
      # The actual macOS version is recorded; this is not minimum-VM evidence.
      - name: Native probe and deliberately wrong expectation
        env:
          PROBE_CASE: ${{ matrix.probe }}
        run: python3 bench/probes/run-collector-probes.py --case "$PROBE_CASE" --allow-observed-platform-differences --out target/collector-probes/result.json --ledger-out target/collector-probes/acceptance.tsv
      - name: Preserve observations, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: collector-probes-${{ matrix.os }}
          path: target/collector-probes/
          if-no-files-found: error

  lint:
    name: Lint (rustfmt, clippy)
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Include Linux-only unit/integration test paths for both sibling crates.
      - run: cargo clippy -j 2 -p bingsu -p bingsu-collect --all-targets --target x86_64-unknown-linux-gnu -- -D warnings
      - run: cargo clippy -j 2 -p bingsu -p bingsu-collect --all-targets --target x86_64-unknown-linux-musl -- -D warnings

  collector-msrv:
    name: Collector deployment MSRV (1.88)
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.88.0
      # 이것을 실패시키는 것: 제품이나 전이 의존성이 MSRV보다 새 문법/API를 쓰는 것.
      - run: cargo build --locked -j 2 -p bingsu -p bingsu-collect

  collector:
    name: Dedicated collector (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # Audit the real linked binaries, then strip those same files for shipping.
      CARGO_PROFILE_RELEASE_STRIP: "none"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # 이것을 실패시키는 것: Rust 행이 미실행/ignored여도 cargo 종료 코드만으로 통과하는 것.
      - run: |
          set -o pipefail
          cargo test -j 2 -p bingsu-collect --test startup -- --test-threads=2 | tee "$RUNNER_TEMP/startup-native.txt"
      - run: |
          set -o pipefail
          cargo test -j 2 -p bingsu --test collector_lifecycle --test collection_store --bin bingsu -- --test-threads=2 | tee "$RUNNER_TEMP/lifecycle-native.txt"
          grep -F 'test partial_survives_only_after_validated_updates ... ok' "$RUNNER_TEMP/lifecycle-native.txt"
          grep -F 'test slow_drip_does_not_extend_spawn_deadline ... ok' "$RUNNER_TEMP/lifecycle-native.txt"
          grep -F 'test immediate_ready_is_not_read_or_decoded_before_confinement ... ok' "$RUNNER_TEMP/lifecycle-native.txt"
          grep -F 'test verified_screen_spawns_once_before_helper_tsync ... ok' "$RUNNER_TEMP/lifecycle-native.txt"
          grep -F 'test publication_checks_same_fd_bytes_and_identity ... ok' "$RUNNER_TEMP/lifecycle-native.txt"
          grep -F 'test helper_close_never_unlocks_live_worker ... ok' "$RUNNER_TEMP/lifecycle-native.txt"
          grep -F 'test hash_collision_never_reuses_or_overwrites_other_cwd ... ok' "$RUNNER_TEMP/lifecycle-native.txt"
          grep -F 'test gc_cannot_split_lock_inode_or_delete_inflight_store ... ok' "$RUNNER_TEMP/lifecycle-native.txt"
          grep -F 'test legacy_gc_prunes_only_empty_suffixes ... ok' "$RUNNER_TEMP/lifecycle-native.txt"
          grep -F 'test gc_time_cap_stops_before_filesystem_work ... ok' "$RUNNER_TEMP/lifecycle-native.txt"
          grep -F 'test early_exit_never_signals_recycled_pid ... ok' "$RUNNER_TEMP/lifecycle-native.txt"
          grep -F 'test lock_clock_includes_store_close_without_publication ... ok' "$RUNNER_TEMP/lifecycle-native.txt"
          grep -F 'test prompt_read::tests::new_completion_never_blocks_the_current_prompt ... ok' "$RUNNER_TEMP/lifecycle-native.txt"
      - run: |
          set -o pipefail
          cargo test -j 2 -p bingsu-core --test collection_selection | tee "$RUNNER_TEMP/selection-native.txt"
          grep -F 'test product_mask_is_zero_and_fixture_is_unreachable ... ok' "$RUNNER_TEMP/selection-native.txt"
      - name: Collector policy evaluator and table correspondence
        run: python3 scripts/check_collector_filter.py
      - if: runner.os == 'Linux'
        name: Native collector kernel probes (required cells, no silent skip)
        env:
          BINGSU_REQUIRE_CLONE3_CONTROL: "1"
          BINGSU_REQUIRE_LANDLOCK: "1"
        run: |
          set -o pipefail
          cargo test --locked -j 2 -p bingsu-collect --test filter -- --nocapture --test-threads=2 | tee "$RUNNER_TEMP/filter-native.txt"
          grep -F 'test landlock::tests::landlock_abi_and_failure_matrix ... ok' "$RUNNER_TEMP/startup-native.txt"
          grep -F 'test runtime::x14_threads_and_status_survive_fork_is_refused ... ok' "$RUNNER_TEMP/filter-native.txt"
          grep -F 'test runtime::x16_all_mutations_are_denied_with_fsize_zero ... ok' "$RUNNER_TEMP/filter-native.txt"
      - if: runner.os == 'Linux'
        name: Install native M3b trace tool
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends strace
          strace --version
      # 이것을 실패시키는 것: repository phase trace나 새 kernel 경계 시험을 생략하는 것.
      - if: runner.os == 'Linux'
        name: Repository read layer trace and acceptance
        run: |
          set -o pipefail
          PYTHONPYCACHEPREFIX=$(mktemp -d) python3 -B scripts/check_collector_filter.py --repository-trace
          grep -F 'test runtime::openat2_never_bypasses_write_denial ... ok' "$RUNNER_TEMP/filter-native.txt"
          grep -F 'test runtime::read_landlock_grants_only_selected_roots ... ok' "$RUNNER_TEMP/filter-native.txt"
          grep -F 'test runtime::openat2_probe_precedes_read_layer ... ok' "$RUNNER_TEMP/filter-native.txt"
          grep -F 'test runtime::resolver_is_selected_once_per_process ... ok' "$RUNNER_TEMP/filter-native.txt"
          grep -F 'test runtime::linux_collection_floor_requires_capabilities ... ok' "$RUNNER_TEMP/filter-native.txt"
          grep -F 'test runtime::repository_read_layer_cost_has_200_samples ... ok' "$RUNNER_TEMP/filter-native.txt"
      - if: runner.os == 'Linux'
        name: Collector policy mutations, including real seal and fd rules
        env:
          BINGSU_REQUIRE_CLONE3_CONTROL: "1"
          BINGSU_REQUIRE_LANDLOCK: "1"
        run: PYTHONPYCACHEPREFIX=$(mktemp -d) python3 -B scripts/check_collector_filter.py --mutations --runtime
      - if: runner.os == 'Linux'
        name: Final filter refuses root limit and capability changes
        run: |
          set -o pipefail
          cargo test --locked -j 2 -p bingsu-collect --test filter --no-run --message-format=json > "$RUNNER_TEMP/filter.json"
          bin=$(python3 -c 'import json,sys; print(next(v["executable"] for line in open(sys.argv[1]) if (v:=json.loads(line)).get("reason")=="compiler-artifact" and v["target"]["name"]=="filter" and v.get("executable")))' "$RUNNER_TEMP/filter.json")
          sudo env BINGSU_REQUIRE_LANDLOCK=1 BINGSU_REQUIRE_ROOT_FILTER=1 "$bin" --exact runtime::filter_installed_before_threads_and_ready --nocapture --test-threads=1 | tee "$RUNNER_TEMP/root-filter.txt"
          grep -Fx 'B2 limits PASS' "$RUNNER_TEMP/root-filter.txt"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/root-filter.txt"
      - if: runner.os == 'Linux'
        name: Native musl collector probes (both architectures)
        env:
          BINGSU_REQUIRE_CLONE3_CONTROL: "1"
          BINGSU_REQUIRE_LANDLOCK: "1"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC: musl-gcc
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q musl-tools
          target="$(uname -m)-unknown-linux-musl"
          rustup target add "$target"
          # musl-gcc drops /usr/include, where linux-libc-dev puts the UAPI headers.
          BINGSU_X16_CFLAGS="-idirafter /usr/include -idirafter /usr/include/$(uname -m)-linux-gnu"
          export BINGSU_X16_CFLAGS
          set -o pipefail
          cargo test --locked -j 2 -p bingsu-collect --target "$target" --test startup --test filter -- --nocapture --test-threads=2 | tee "$RUNNER_TEMP/filter-musl.txt"
          grep -F 'test runtime::x14_threads_and_status_survive_fork_is_refused ... ok' "$RUNNER_TEMP/filter-musl.txt"
          grep -F 'test runtime::x16_all_mutations_are_denied_with_fsize_zero ... ok' "$RUNNER_TEMP/filter-musl.txt"
          grep -F 'test worker_limits_fail_without_blocking_front ... ok' "$RUNNER_TEMP/filter-musl.txt"
      - if: runner.os == 'Linux'
        name: Independent gix 0.83.0 X-14 (locked, glibc and musl)
        env:
          BINGSU_REQUIRE_LANDLOCK: "1"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          set -o pipefail
          # The release lead supplies this lock; absence is an incomplete gate.
          test -s bench/probes/collector-x14/Cargo.lock
          cargo run --locked -j 2 --manifest-path bench/probes/collector-x14/Cargo.toml --release -- --case all | tee "$RUNNER_TEMP/x14-gnu.txt"
          grep -Fx 'X-14 PASS' "$RUNNER_TEMP/x14-gnu.txt"
          target="$(uname -m)-unknown-linux-musl"
          CC=musl-gcc cargo run --locked -j 2 --manifest-path bench/probes/collector-x14/Cargo.toml --target "$target" --release -- --case all | tee "$RUNNER_TEMP/x14-musl.txt"
          grep -Fx 'X-14 PASS' "$RUNNER_TEMP/x14-musl.txt"
      - run: cargo build -j 2 --release -p bingsu -p bingsu-collect
      - name: Exact product and separate bench dependency audit
        run: python3 scripts/check_collector_dependencies.py
      - if: runner.os == 'Linux'
        name: Privileged capability removal (no silent skip)
        run: |
          set -o pipefail
          cargo test -j 2 -p bingsu-collect --test startup --no-run --message-format=json > "$RUNNER_TEMP/startup.json"
          bin=$(python3 -c 'import json,sys; print(next(v["executable"] for line in open(sys.argv[1]) if (v:=json.loads(line)).get("reason")=="compiler-artifact" and v["target"]["name"]=="startup" and v.get("executable")))' "$RUNNER_TEMP/startup.json")
          sudo "$bin" --exact limits::tests::root_cannot_restore_limits_or_capabilities --ignored --test-threads=1 | tee "$RUNNER_TEMP/root-capabilities.txt"
          grep -F 'test limits::tests::root_cannot_restore_limits_or_capabilities ... ok' "$RUNNER_TEMP/root-capabilities.txt"
          grep -F 'test result: ok. 1 passed;' "$RUNNER_TEMP/root-capabilities.txt"
      # 이것을 실패시키는 것: 출하 collector의 spawn/import 또는 앞단 gix 심벌 유입.
      - name: Product imports and matching deployment pair
        run: python3 scripts/check_collector_symbols.py target/release/bingsu-collect --sibling target/release/bingsu --unstripped-dir target/release/symbol-audit --strip
      - if: runner.os == 'macOS'
        name: Both shipped Mach-O architectures
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --locked -j 2 --release -p bingsu -p bingsu-collect --target aarch64-apple-darwin
          python3 scripts/check_collector_symbols.py target/aarch64-apple-darwin/release/bingsu-collect --sibling target/aarch64-apple-darwin/release/bingsu --unstripped-dir target/aarch64-apple-darwin/release/symbol-audit --strip
          cargo build --locked -j 2 --release -p bingsu -p bingsu-collect --target x86_64-apple-darwin
          python3 scripts/check_collector_symbols.py target/x86_64-apple-darwin/release/bingsu-collect --sibling target/x86_64-apple-darwin/release/bingsu --unstripped-dir target/x86_64-apple-darwin/release/symbol-audit --strip
      - name: Prepare Python audit tests
        run: |
          python3 -m venv "$RUNNER_TEMP/collector-tests"
          "$RUNNER_TEMP/collector-tests/bin/python" -m pip install --require-hashes --only-binary=:all: -r tests/shell/requirements.txt
      - name: Host dependency, symbol and manifest mutations
        run: '"$RUNNER_TEMP/collector-tests/bin/python" -m pytest scripts/test_collector_audits.py -q -p no:cacheprovider'
      - name: Prepare runtime audit fixtures on the host
        run: python3 scripts/prepare_collector_audit.py
      - name: Resource isolation; macOS interpose and descendant audit
        run: '"$RUNNER_TEMP/collector-tests/bin/python" -m pytest tests/shell/test_collector_no_spawn_macos.py -q -p no:cacheprovider'

      - name: Prepare M3b compiler-free product fixtures
        # Native Linux (x86_64/arm64) and macOS: prepare the current release
        # siblings after all builds; pytest below selects this exact pair.
        run: python3 bench/collector-product.py --prepare target/release/bingsu
      - name: M3b product security and measurements contracts
        run: |
          set -o pipefail
          export BINGSU_BIN="$PWD/target/release/bingsu"
          mkdir -p "$RUNNER_TEMP/m3b-traces"
          "$RUNNER_TEMP/collector-tests/bin/python" -m pytest tests/shell/test_collector_security.py bench/tests/test_collector_product.py tools/fsbudget/tests -q -rA -p no:cacheprovider --basetemp="$RUNNER_TEMP/m3b-traces/native" | tee "$RUNNER_TEMP/m3b-security.txt"
          grep -F 'PASSED tests/shell/test_collector_security.py::test_security_table_resource_failures_preserve_front[cpu]' "$RUNNER_TEMP/m3b-security.txt"
          grep -F 'PASSED tests/shell/test_collector_security.py::test_security_table_resource_failures_preserve_front[nofile]' "$RUNNER_TEMP/m3b-security.txt"
          grep -F 'PASSED bench/tests/test_collector_product.py::test_latency_measures_verification_spawn_ready_and_read_separately' "$RUNNER_TEMP/m3b-security.txt"
          # 이것을 실패시키는 것: 매개변수 하나의 PASS로 다른 매개변수의 skip을 숨기는 것.
          grep -F 'PASSED bench/tests/test_collector_product.py::test_normal_product_measurement_refuses_fallback_and_broken_records[degraded]' "$RUNNER_TEMP/m3b-security.txt"
          grep -F 'PASSED bench/tests/test_collector_product.py::test_normal_product_measurement_refuses_fallback_and_broken_records[version]' "$RUNNER_TEMP/m3b-security.txt"
          grep -F 'PASSED bench/tests/test_collector_product.py::test_normal_product_measurement_refuses_fallback_and_broken_records[field-count]' "$RUNNER_TEMP/m3b-security.txt"
          grep -F 'PASSED bench/tests/test_collector_product.py::test_normal_product_measurement_refuses_fallback_and_broken_records[stderr]' "$RUNNER_TEMP/m3b-security.txt"
          grep -F 'PASSED bench/tests/test_collector_product.py::test_normal_product_measurement_refuses_fallback_and_broken_records[exit]' "$RUNNER_TEMP/m3b-security.txt"
          grep -F 'PASSED bench/tests/test_collector_product.py::test_pair_alternates_and_preserves_raw_observations' "$RUNNER_TEMP/m3b-security.txt"
          grep -F 'PASSED bench/tests/test_collector_product.py::test_product_budgets_cover_success_failure_and_gc' "$RUNNER_TEMP/m3b-security.txt"
          grep -F 'PASSED bench/tests/test_collector_product.py::test_product_helper_keeps_the_shared_observation_wiring' "$RUNNER_TEMP/m3b-security.txt"
          grep -F 'PASSED bench/tests/test_collector_product.py::test_unavailable_normal_prompt_keeps_evidence_but_blocks_acceptance' "$RUNNER_TEMP/m3b-security.txt"
          grep -F 'PASSED tests/shell/test_collector_security.py::test_acceptance_table_tests_exist_and_run_in_ci' "$RUNNER_TEMP/m3b-security.txt"
          grep -F 'PASSED tests/shell/test_collector_security.py::test_b2_lower_bound_is_replaced_by_product_filter_evidence' "$RUNNER_TEMP/m3b-security.txt"
          grep -F 'PASSED tools/fsbudget/tests/test_repository.py::test_repository_trace_checks_paths_counts_and_phases' "$RUNNER_TEMP/m3b-security.txt"
          grep -F 'PASSED tests/shell/test_collector_security.py::test_ci_has_no_silent_acceptance_skip' "$RUNNER_TEMP/m3b-security.txt"
          "$RUNNER_TEMP/collector-tests/bin/python" -m pytest tests/shell/test_prompt_trace_budget.py::test_collector_gate_keeps_role_and_kind_budgets_separate -q -rA -p no:cacheprovider | tee "$RUNNER_TEMP/m3b-trace-contract.txt"
          grep -F 'PASSED tests/shell/test_prompt_trace_budget.py::test_collector_gate_keeps_role_and_kind_budgets_separate' "$RUNNER_TEMP/m3b-trace-contract.txt"
          grep -F 'PASSED tools/fsbudget/tests/test_attribute.py::test_collector_role_mutations_are_refused' "$RUNNER_TEMP/m3b-security.txt"
          grep -F 'PASSED tools/fsbudget/tests/test_attribute.py::test_trace_attributes_spawn_sites_and_fd_lifetimes' "$RUNNER_TEMP/m3b-security.txt"
          grep -F 'PASSED tools/fsbudget/tests/test_gate.py::test_role_and_kind_surplus_is_never_hidden' "$RUNNER_TEMP/m3b-security.txt"
      - if: runner.os == 'Linux'
        name: Assert native Linux M3b security passes
        run: |
          grep -F 'PASSED tests/shell/test_collector_security.py::test_security_table_resource_failures_preserve_front[as]' "$RUNNER_TEMP/m3b-security.txt"
          grep -F 'PASSED tests/shell/test_collector_security.py::test_security_table_resource_failures_preserve_front[exec]' "$RUNNER_TEMP/m3b-security.txt"
          grep -F 'PASSED tests/shell/test_collector_security.py::test_shipped_collector_ready_has_installed_limits' "$RUNNER_TEMP/m3b-security.txt"
          grep -F "PASSED tests/shell/test_collector_security.py::test_failure_modes_trace_collector_effects[--cpu-worker]" "$RUNNER_TEMP/m3b-security.txt"
          grep -F "PASSED tests/shell/test_collector_security.py::test_failure_modes_trace_collector_effects[--nofile-worker]" "$RUNNER_TEMP/m3b-security.txt"
          grep -F "PASSED tests/shell/test_collector_security.py::test_failure_modes_trace_collector_effects[--as-worker]" "$RUNNER_TEMP/m3b-security.txt"
          grep -F "PASSED tests/shell/test_collector_security.py::test_failure_modes_trace_collector_effects[--exec-worker]" "$RUNNER_TEMP/m3b-security.txt"
          grep -F "PASSED tests/shell/test_collector_security.py::test_failure_modes_trace_collector_effects[--ready-failure-worker]" "$RUNNER_TEMP/m3b-security.txt"
          grep -F "PASSED tests/shell/test_collector_security.py::test_failure_modes_trace_collector_effects[--malformed-worker]" "$RUNNER_TEMP/m3b-security.txt"
          grep -F 'PASSED tests/shell/test_collector_security.py::test_native_collector_trace_has_no_forbidden_effect' "$RUNNER_TEMP/m3b-security.txt"
          grep -F 'PASSED tests/shell/test_collector_security.py::test_shipped_collector_trace_has_no_forbidden_effect' "$RUNNER_TEMP/m3b-security.txt"
      - if: runner.os == 'macOS'
        name: Assert native macOS M3b security passes
        run: |
          grep -F 'PASSED tests/shell/test_collector_security.py::test_macos_first_completed_overlimit_sample' "$RUNNER_TEMP/m3b-security.txt"
      - if: runner.os == 'Linux'
        name: M3b native musl lifecycle security
        env:
          CC: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          set -o pipefail
          triple="$(uname -m)-unknown-linux-musl"
          cargo build -j 2 --release -p bingsu -p bingsu-collect --target "$triple"
          # 이것을 실패시키는 것: 정적 musl ELF를 빈 동적 심벌 표만으로 통과시키는 것.
          python3 scripts/check_collector_symbols.py "target/$triple/release/bingsu-collect" --sibling "target/$triple/release/bingsu" --unstripped-dir "target/$triple/release/symbol-audit" --strip
          python3 bench/collector-product.py --prepare "target/$triple/release/bingsu"
          export BINGSU_BIN="$PWD/target/$triple/release/bingsu"
          mkdir -p "$RUNNER_TEMP/m3b-traces"
          "$RUNNER_TEMP/collector-tests/bin/python" -m pytest tests/shell/test_collector_security.py -q -rA -p no:cacheprovider --basetemp="$RUNNER_TEMP/m3b-traces/musl" | tee "$RUNNER_TEMP/m3b-musl.txt"
          grep -F 'PASSED tests/shell/test_collector_security.py::test_shipped_collector_ready_has_installed_limits' "$RUNNER_TEMP/m3b-musl.txt"
          grep -F "PASSED tests/shell/test_collector_security.py::test_failure_modes_trace_collector_effects[--cpu-worker]" "$RUNNER_TEMP/m3b-musl.txt"
          grep -F "PASSED tests/shell/test_collector_security.py::test_failure_modes_trace_collector_effects[--nofile-worker]" "$RUNNER_TEMP/m3b-musl.txt"
          grep -F "PASSED tests/shell/test_collector_security.py::test_failure_modes_trace_collector_effects[--as-worker]" "$RUNNER_TEMP/m3b-musl.txt"
          grep -F "PASSED tests/shell/test_collector_security.py::test_failure_modes_trace_collector_effects[--exec-worker]" "$RUNNER_TEMP/m3b-musl.txt"
          grep -F "PASSED tests/shell/test_collector_security.py::test_failure_modes_trace_collector_effects[--ready-failure-worker]" "$RUNNER_TEMP/m3b-musl.txt"
          grep -F "PASSED tests/shell/test_collector_security.py::test_failure_modes_trace_collector_effects[--malformed-worker]" "$RUNNER_TEMP/m3b-musl.txt"
          grep -F "PASSED tests/shell/test_collector_security.py::test_security_table_resource_failures_preserve_front[cpu]" "$RUNNER_TEMP/m3b-musl.txt"
          grep -F "PASSED tests/shell/test_collector_security.py::test_security_table_resource_failures_preserve_front[nofile]" "$RUNNER_TEMP/m3b-musl.txt"
          grep -F "PASSED tests/shell/test_collector_security.py::test_security_table_resource_failures_preserve_front[as]" "$RUNNER_TEMP/m3b-musl.txt"
          grep -F "PASSED tests/shell/test_collector_security.py::test_security_table_resource_failures_preserve_front[exec]" "$RUNNER_TEMP/m3b-musl.txt"
          grep -F 'PASSED tests/shell/test_collector_security.py::test_b2_lower_bound_is_replaced_by_product_filter_evidence' "$RUNNER_TEMP/m3b-musl.txt"
          grep -F 'PASSED tests/shell/test_collector_security.py::test_native_collector_trace_has_no_forbidden_effect' "$RUNNER_TEMP/m3b-musl.txt"
          grep -F 'PASSED tests/shell/test_collector_security.py::test_shipped_collector_trace_has_no_forbidden_effect' "$RUNNER_TEMP/m3b-musl.txt"
      - name: Preserve M3b raw security traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m3b-security-traces-${{ matrix.os }}
          path: ${{ runner.temp }}/m3b-traces/**/*.trace
          if-no-files-found: warn
      - name: Preserve M3b native acceptance output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m3b-security-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/m3b-security.txt
            ${{ runner.temp }}/m3b-musl.txt
            ${{ runner.temp }}/filter-native.txt
            ${{ runner.temp }}/filter-musl.txt
            target/b3-evidence/
          if-no-files-found: error

  test:
    name: Test (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - if: runner.os == 'Linux'
        run: ldd --version | head -n 1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install the schema test validator
        shell: python3 {0}
        run: |
          import os
          import pathlib
          import subprocess
          import venv
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "schema-venv"
          venv.create(root, with_pip=True)
          python = root / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
          subprocess.run([str(python), "-m", "pip", "install", "--require-hashes", "--only-binary=:all:", "-r", "scripts/schema-requirements.txt"], check=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"BINGSU_SCHEMA_PY={python}\n")
      - name: Mount a real filesystem for X-11 (no silent skip)
        if: runner.os == 'macOS'
        run: |
          mount_path="$RUNNER_TEMP/bingsu-x11-mount"
          mkdir -p "$mount_path"
          hdiutil create -size 8m -fs APFS -volname BingsuX11 "$RUNNER_TEMP/bingsu-x11.dmg"
          hdiutil attach -nobrowse -mountpoint "$mount_path" "$RUNNER_TEMP/bingsu-x11.dmg"
          echo "BINGSU_X11_MOUNT=$mount_path" >> "$GITHUB_ENV"
      # The runners are not in a container, so clone3 must reach the kernel
      # (EINVAL) without the stub's filter; the clone3 test fails otherwise.
      # They also run as a non-root user, so the tests that skip as root must
      # run here; a runner that turns root fails them instead.
      - run: cargo test --workspace --all-features
        env:
          BINGSU_REQUIRE_CLONE3_CONTROL: "1"
          BINGSU_REQUIRE_NONROOT_TESTS: "1"
      - name: Detach the X-11 filesystem
        if: always() && runner.os == 'macOS' && env.BINGSU_X11_MOUNT != ''
        run: |
          hdiutil detach "$BINGSU_X11_MOUNT"
          rm -f "$RUNNER_TEMP/bingsu-x11.dmg"
      # The cgroup spawn tests and the X-04 probe test (probe_shapes
      # x04_delegated) skip without a delegated cgroup v2 area. Here they must
      # run: a lingering user manager gives this user a scope with
      # Delegate=yes (the same path a desktop session uses), and
      # BINGSU_REQUIRE_CGROUP_TESTS=1 turns a skip into a failure.
      - if: runner.os == 'Linux'
        name: Cgroup spawn tests in a delegated cgroup
        env:
          BINGSU_REQUIRE_CGROUP_TESTS: "1"
        run: |
          sudo loginctl enable-linger "$(id -un)"
          uid=$(id -u)
          export XDG_RUNTIME_DIR="/run/user/$uid"
          for _ in $(seq 50); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 0.2; done
          cargo test -p bingsu-bench --no-run --message-format=json > "$RUNNER_TEMP/build.json"
          for t in cgroup_spawn spawn_matrix_rows probe_shapes; do
            bin=$(jq -r --arg t "$t" 'select(.reason == "compiler-artifact" and .target.name == $t and .profile.test) | .executable' "$RUNNER_TEMP/build.json")
            [ -x "$bin" ] || { echo "no test binary for $t" >&2; exit 1; }
            # shellcheck disable=SC2016 # expanded by the inner sh, inside the scope
            systemd-run --user --scope --quiet -p Delegate=yes \
              sh -c 'BINGSU_TEST_CGROUP_DIR="/sys/fs/cgroup$(cut -d: -f3 /proc/self/cgroup)" exec "$0"' "$bin"
          done

  purity:
    name: Core purity gate
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy
          # The gate builds bingsu-core and bingsu-identity without std;
          # the front graph remains pinned to 11 packages.
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2
      - run: scripts/check-core-purity.sh
      - name: Install the schema test validator
        run: |
          python3 -m venv "$RUNNER_TEMP/schema-venv"
          "$RUNNER_TEMP/schema-venv/bin/python" -m pip install --require-hashes --only-binary=:all: -r scripts/schema-requirements.txt
          echo "$RUNNER_TEMP/schema-venv/bin" >> "$GITHUB_PATH"
      - run: python3 scripts/check_schema_corpus.py
      - run: python3 -B scripts/test_check_diag_codes.py
      - name: Diagnostic codes are append-only
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          python3 scripts/check_diag_codes.py "origin/$BASE_REF"
      - run: cargo deny --config deny.toml check
      # The size probe is outside the workspace with its own lock; the same
      # policy covers it.
      - run: cargo deny --locked --manifest-path bench/size-probe/Cargo.toml --config deny.toml check

  wasm:
    name: Core wasm32 build
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown, wasm32-wasip1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p bingsu-core --target wasm32-unknown-unknown
      - run: cargo clippy -p bingsu-core --target wasm32-unknown-unknown -- -D warnings -F clippy::disallowed_methods -F clippy::disallowed_types -F clippy::disallowed_macros
      # Determinism golden (spec section 7 layer 7, F-06): the native half is
      # the bingsu-golden test in the Test job (Linux, macOS, Windows); this is
      # the wasm32 half. cmp fails on a missing golden file as well.
      - name: Install wasmtime (pinned release, checksum verified)
        run: |
          file="wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          curl -fsSLO "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${file}"
          echo "a4d6e9e3a5a60f527cf7793d674c48930c80c2e8977995b8a275cad3254b9322  ${file}" | sha256sum --check
          tar -xJf "${file}"
          echo "$PWD/wasmtime-${WASMTIME_VERSION}-x86_64-linux" >> "$GITHUB_PATH"
      - name: Render golden (wasm32-wasip1 under wasmtime)
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          cargo build -p bingsu-golden --release --target wasm32-wasip1
          wasmtime run target/wasm32-wasip1/release/bingsu-golden.wasm > "$RUNNER_TEMP/render-wasm.tsv"
          cmp "$RUNNER_TEMP/render-wasm.tsv" tests/golden/render/render.tsv

      # 이것을 실패시키는 것: snapshot codec의 native/WASM 바이트 차이.
      - name: Snapshot golden (native and wasm32-unknown-unknown)
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          cargo run -q -p bingsu-core-tests --example snapshot_fixture > "$RUNNER_TEMP/snapshot-native.bin"
          cmp "$RUNNER_TEMP/snapshot-native.bin" tests/golden/snapshot/fixture.bin
          RUSTFLAGS='--cfg getrandom_backend="unsupported"' cargo build -p bingsu-core-tests --example snapshot_fixture --target wasm32-unknown-unknown
          node scripts/check_snapshot_wasm.mjs target/wasm32-unknown-unknown/debug/examples/snapshot_fixture.wasm "$RUNNER_TEMP/snapshot-native.bin"

  # src/ucd.rs must be exactly what the generator makes from the Unicode
  # 17.0.0 files committed under tools/gen-ucd-tables/data (sha256 checked
  # inside gen.py). No network: unicode.org is only used by fetch.sh when the
  # version is raised.
  ucd:
    name: Unicode tables match the generator
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B tools/gen-ucd-tables/test_gen.py
      - run: python3 -B tools/gen-ucd-tables/gen.py --check crates/bingsu-core/src/ucd.rs

  # Instruction counts of core paths (spec section 8 "측정과 게이트", M2).
  # Callgrind counts do not drift for one binary and one Valgrind, so the
  # base tip and the PR are measured in this job on this runner and
  # compared. The checkout is the merge commit of the base tip and the PR
  # head, so HEAD^1 is the base tip and HEAD is the code that main becomes.
  # Every bench target of the package is its own binary (benches in one
  # binary changed each other's inlining) and is compared on its own; a
  # target the base tip lacks records only. Linux only (Valgrind).
  icount:
    name: Core instruction counts
    needs: detect
    if: needs.detect.outputs.rust == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GUNGRAUN_VERSION: 0.20.0
      CARGO_BUILD_JOBS: 2
      # Pinned so the base and the PR, and runs on different days, compare
      # like with like. Bump by hand together with the stable toolchain.
      ICOUNT_RUST: 1.98.1
      # Decided by package, not by path: a moved manifest must not turn the
      # gate into record-only.
      BENCH_PACKAGE: bingsu-core-bench
      # The bench targets of the package, one name per line, sorted.
      BENCH_TARGETS_JQ: '.packages[] | select(.name == env.BENCH_PACKAGE) | .targets[] | select(.kind | index("bench")) | .name'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.ICOUNT_RUST }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check the bench package and the runner version
        run: |
          set -o pipefail
          pkgs=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name')
          if ! grep -qx "$BENCH_PACKAGE" <<<"$pkgs"; then
            echo "::error::package $BENCH_PACKAGE is missing in the pull request"
            exit 1
          fi
          cargo metadata --no-deps --format-version 1 | jq -r "$BENCH_TARGETS_JQ" | sort > "$RUNNER_TEMP/pr.targets"
          if [ ! -s "$RUNNER_TEMP/pr.targets" ]; then
            echo "::error::package $BENCH_PACKAGE has no bench targets"
            exit 1
          fi
          # The runner must match the library in Cargo.lock (a dependency
          # bump of gungraun alone would leave them apart).
          locked=$(awk '$0 == "name = \"gungraun\"" { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          if [ "$locked" != "$GUNGRAUN_VERSION" ]; then
            echo "::error::Cargo.lock has gungraun '$locked' but GUNGRAUN_VERSION is $GUNGRAUN_VERSION"
            exit 1
          fi
      - name: Install Valgrind and the matching gungraun-runner
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q valgrind
          cargo install -j 2 gungraun-runner --version "$GUNGRAUN_VERSION" --locked
          { rustc -V; valgrind --version; cargo install --list | grep "^gungraun-runner"; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Baseline at the base tip
        run: |
          set -o pipefail
          echo "GUNGRAUN_HOME=$RUNNER_TEMP/gungraun" >> "$GITHUB_ENV"
          export GUNGRAUN_HOME="$RUNNER_TEMP/gungraun"
          # base tip + PR head: three words (the commit and two parents)
          if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -ne 3 ]; then
            echo "::error::HEAD is not a merge commit of the base tip and the PR head"
            exit 1
          fi
          git worktree add "$RUNNER_TEMP/base" "$(git rev-parse HEAD^1)"
          # No bench package at the base tip gives no targets: every target
          # of the pull request records only.
          (cd "$RUNNER_TEMP/base" && cargo metadata --no-deps --format-version 1) | jq -r "$BENCH_TARGETS_JQ" | sort > "$RUNNER_TEMP/base.targets"
          if [ ! -s "$RUNNER_TEMP/base.targets" ]; then
            echo "::warning::base tip has no icount bench targets: this run records only"
            echo "base tip has no icount bench targets: this run records only" >> "$GITHUB_STEP_SUMMARY"
          fi
          mkdir "$RUNNER_TEMP/base-lists"
          # An array, not `while read` on the file: a command in the loop
          # that reads stdin would take the rest of the list.
          mapfile -t targets < "$RUNNER_TEMP/base.targets"
          for t in "${targets[@]}"; do
            (cd "$RUNNER_TEMP/base" && cargo bench -p "$BENCH_PACKAGE" --bench="$t" -- --list --format terse) > "$RUNNER_TEMP/base-lists/$t.list"
            # A target the pull request drops is only listed, for the
            # warning in the next step.
            if grep -Fqx -- "$t" "$RUNNER_TEMP/pr.targets"; then
              (cd "$RUNNER_TEMP/base" && cargo bench -p "$BENCH_PACKAGE" --bench="$t" -- --save-baseline=base)
              if [ ! -s "$RUNNER_TEMP/base-lists/$t.list" ]; then
                echo "::warning::bench target $t of the base tip lists no benchmarks: its benchmarks in the pull request have no baseline"
                echo "bench target $t of the base tip lists no benchmarks: its benchmarks in the pull request have no baseline" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          done
      - name: Pull request against the baseline
        run: |
          set -o pipefail
          export GUNGRAUN_HOME="$RUNNER_TEMP/gungraun"
          mkdir "$RUNNER_TEMP/pr-lists"
          mapfile -t targets < "$RUNNER_TEMP/pr.targets"
          for t in "${targets[@]}"; do
            # A bench binary that lists nothing (for example main! wrapped
            # in a fn) exits 0 without measuring: that must fail, not pass.
            cargo bench -p "$BENCH_PACKAGE" --bench="$t" -- --list --format terse > "$RUNNER_TEMP/pr-lists/$t.list"
            if [ ! -s "$RUNNER_TEMP/pr-lists/$t.list" ]; then
              echo "::error::bench target $t lists no benchmarks"
              exit 1
            fi
            if ! grep -Fqx -- "$t" "$RUNNER_TEMP/base.targets"; then
              { echo "Bench target $t is new since the base tip: recorded only, not compared:"; cat "$RUNNER_TEMP/pr-lists/$t.list"; } | tee -a "$GITHUB_STEP_SUMMARY"
              cargo bench -p "$BENCH_PACKAGE" --bench="$t" -- --save-summary=json
              continue
            fi
            # A bench with no entry in the base list has nothing to compare
            # with; name it in the summary instead of passing it silently.
            new=$(sort "$RUNNER_TEMP/base-lists/$t.list" | comm -13 - <(sort "$RUNNER_TEMP/pr-lists/$t.list"))
            if [ -n "$new" ]; then
              { echo "Benchmarks of $t without a baseline (not compared):"; echo "$new"; } | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            # The reverse: a bench of the base that the pull request drops
            # is no longer gated. Renaming or deleting is allowed, so only
            # report it; the diff shows it to the reviewer.
            removed=$(sort "$RUNNER_TEMP/base-lists/$t.list" | comm -23 - <(sort "$RUNNER_TEMP/pr-lists/$t.list"))
            if [ -n "$removed" ]; then
              echo "::warning::benchmarks of $t at the base tip are missing in the pull request and no longer gated"
              { echo "Benchmarks of $t removed since the base tip (no longer gated):"; echo "$removed"; } | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            cargo bench -p "$BENCH_PACKAGE" --bench="$t" -- --baseline=base --callgrind-limits="$(cat crates/bingsu-core-bench/limits.txt)" --save-summary=json
          done
          # A whole bench target of the base that the pull request drops (or
          # renames) is no longer gated either: report it the same way.
          comm -23 "$RUNNER_TEMP/base.targets" "$RUNNER_TEMP/pr.targets" | while read -r t; do
            echo "::warning::bench target $t of the base tip is missing in the pull request and no longer gated"
            { echo "Bench target $t removed since the base tip (no longer gated):"; cat "$RUNNER_TEMP/base-lists/$t.list"; } | tee -a "$GITHUB_STEP_SUMMARY"
          done
          # A binary the runner cannot find symbols in (a stripped bench
          # profile) counts 0 everywhere and passes; against a baseline 0
          # reads as an improvement. Every listed bench needs one summary
          # (schema 7, gungraun 0.20.0) with a positive Callgrind Ir. Only
          # this step saves summaries, so a stray one fails the count. The
          # list comes from cargo running every bench target at once, not
          # from the loop above: a target that the discovery or the loop
          # skipped has no summaries and fails the count too.
          cargo bench -p "$BENCH_PACKAGE" --benches -- --list --format terse > "$RUNNER_TEMP/all.list"
          mapfile -t summaries < <(find "$GUNGRAUN_HOME" -name summary.json)
          listed=$(wc -l < "$RUNNER_TEMP/all.list")
          if [ "${#summaries[@]}" -ne "$listed" ]; then
            echo "::error::${#summaries[@]} benchmark summaries for $listed listed benchmarks"
            exit 1
          fi
          bad=$(jq -r 'select(.version != "7" or ([.profiles[]? | select(.tool == "Callgrind") | .data.total.metrics.Ir.values.new | numbers | select(. > 0)] | length) != 1) | "\(.module_path).\(.id)"' "${summaries[@]}")
          if [ -n "$bad" ]; then
            echo "::error::benchmarks without a schema 7 summary with a positive instruction count: $(tr '\n' ' ' <<<"$bad")"
            exit 1
          fi

  # Spec section 8 filesystem-call budget scaffold: a synthetic program with
  # known calls runs under strace -f and the counts per role and call kind
  # must match the formulas exactly. Linux only (strace).
  fsbudget:
    name: Filesystem budget scaffold (strace)
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: ldd --version | head -n 1 | tee -a "$GITHUB_STEP_SUMMARY"
      - run: sudo apt-get update && sudo apt-get install -y strace
      # A venv with the hash-pinned test dependencies: the system python
      # refuses pip installs (PEP 668).
      - name: Set up the test environment
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --require-hashes --only-binary=:all: -r tests/shell/requirements.txt
      - run: cargo build -p bingsu-bench --bin fsb-synthetic
      # bench/tests: the strace read-count test needs the release file-cost
      # runner, and the writer-order demo runs in all three shells.
      - run: cargo build --release -p bingsu-bench
      # bench/tests/test_run_e2e.py runs run-e2e.sh against the debug binary
      # (a stand-in replaces the timing tool); a missing binary fails it.
      - run: cargo build -p bingsu
      - name: Install zsh and fish for the writer-order demo
        run: |
          sudo apt-get install -y --no-install-recommends zsh fish
          { bash --version | head -n 1; zsh --version; fish --version; } | tee -a "$GITHUB_STEP_SUMMARY"
      # FSB_REQUIRE_STRACE turns the Linux-only skips into failures, so a
      # missing strace or binary cannot pass this job by skipping.
      - name: Scaffold tests
        env:
          FSB_REQUIRE_STRACE: "1"
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m pytest tools/fsbudget -q -rs -p no:cacheprovider
      # FSB_REQUIRE_STRACE fails the read-count test instead of skipping it;
      # BINGSU_TEST_SHELLS (as in tests/shell) fails a listed shell that is
      # missing; BINGSU_REQUIRE_NONROOT_TESTS fails the tests that skip as
      # root. None of them can pass here by not running.
      - name: Bench tests
        env:
          FSB_REQUIRE_STRACE: "1"
          BINGSU_TEST_SHELLS: bash zsh fish
          BINGSU_REQUIRE_NONROOT_TESTS: "1"
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m pytest bench/tests -q -rs -p no:cacheprovider
