name: Bench

# Measurement only, never a gate: the runners are shared machines, so the
# numbers are recorded as an artifact and read next to the dedicated hosts.
on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Baseline revision with the same measurement-only instrumentation
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  spawn-matrix:
    name: Collector spawn cost matrix (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - run: cargo build --release -p bingsu --features bench-stubs
      - run: cargo build --release -p bingsu-collect -p bingsu-bench
      # Runs without --cgroup-dir, as the plan records the CI matrix: the cgroup
      # rows are na here; the delegated-cgroup rows are measured on the Linux host.
      - name: Run the matrix
        run: |
          printf '{"meta":{"host":"github-actions","runner":"ubuntu-24.04","arch":"%s","kernel":"%s","nproc":%s,"commit":"%s"}}\n' \
            "$(uname -m)" "$(uname -r)" "$(nproc)" "$GITHUB_SHA" > m1-spawn-ci-linux.jsonl
          target/release/m1-spawn-matrix --dedicated target/release/m1-collect-stub --same target/release/bingsu >> m1-spawn-ci-linux.jsonl
          cat m1-spawn-ci-linux.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m1-spawn-ci-linux
          path: m1-spawn-ci-linux.jsonl
          if-no-files-found: error

  collector-product:
    name: M3b product observations (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base_ref }}
          path: base
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      # Preparation is explicit and host-only. A base without instrumentation
      # is BLOCKED, rather than reusing B2 lower-bound numbers as product data.
      - name: Build both sibling pairs and main-thread fixtures
        run: |
          cargo build --manifest-path base/Cargo.toml -j 2 --release -p bingsu -p bingsu-collect
          cargo build --manifest-path candidate/Cargo.toml -j 2 --release -p bingsu -p bingsu-collect
          python3 candidate/bench/collector-product.py --prepare base/target/release/bingsu --out candidate/target/base-preparation.json
          python3 candidate/bench/collector-product.py --prepare candidate/target/release/bingsu --out candidate/target/candidate-preparation.json
      - name: Record 200 alternating warm observations and first-process cold
        env:
          BINGSU_MEASUREMENT_REVISION: ${{ github.sha }}
          BINGSU_BASE_REVISION: ${{ inputs.base_ref }}
          BINGSU_CANDIDATE_REVISION: ${{ github.sha }}
        run: python3 candidate/bench/collector-product.py --base base/target/release/bingsu --candidate candidate/target/release/bingsu --rounds 200 --out candidate/target/m3b-product.json
      - name: Preserve M3b observations including BLOCKED evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m3b-product-${{ matrix.os }}
          path: |
            candidate/target/*preparation.json
            candidate/target/m3b-product.json
          if-no-files-found: error
