          grep -Fx 'PASSED tests/shell/test_command_cgroup.py::test_best_effort_group_kill_under_the_filter' "$RUNNER_TEMP/cell-py.txt"

  # Every system call the prompt makes after its seccomp filter is installed
  # is a row of crates/bingsu/prompt-syscalls.tsv and none is refused
  # (tests/shell/test_prompt_env_paths.py::test_calls_after_the_filter_are_in_the_table),
  # for each x86_64 libc and profile the release ships or tests run, plus the
  # aarch64 release cells the helper stage gate needs. The binary runs
  # natively on the runner (no container: the runner's own glibc).
  filter-calls:
    # Selects individual shell modules below, never test_collector_security.py;
    # the dedicated collector job owns host preparation and security evidence.
    name: Prompt filter calls (${{ matrix.os }} ${{ matrix.libc }} ${{ matrix.profile }})
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        libc: [gnu, musl]
        profile: [debug, release]
        # GATE-FS-HELPER.1 counts x86_64 and aarch64, glibc and musl, release.
        include:
          - os: ubuntu-24.04-arm
            libc: gnu
            profile: release
          - os: ubuntu-24.04-arm
            libc: musl
            profile: release
    env:
      LIBC: ${{ matrix.libc }}
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.os }}-${{ matrix.libc }}-${{ matrix.profile }}
      - name: Build
        run: |
          # version-stub: the builtin probe tests' language command (D3a).
          args=(-p bingsu -p bingsu-prompt -p bingsu-collect -p bingsu-bench --bin bingsu --bin bingsu-prompt --bin bingsu-collect --bin version-stub)
          dir=target
          if [ "$PROFILE" = release ]; then args+=(--release); fi
          if [ "$LIBC" = musl ]; then musl="$(uname -m)-unknown-linux-musl"; args+=(--target "$musl"); dir="target/$musl"; fi
          cargo build "${args[@]}"
          echo "BINGSU_BIN=$PWD/$dir/$PROFILE/bingsu" >> "$GITHUB_ENV"
      # K82 uses a glibc test binary with LD_PRELOAD; C3 uses a main-thread
      # reader target. Build both before pytest (shell tests never compile).
      - name: Build procfs test profile
        if: matrix.libc == 'gnu' && matrix.profile == 'debug'
        run: cargo test -j 2 -p bingsu --bin bingsu --test collection_reader --test cli_prompt --no-run
      # strace, and a venv with the hash-pinned test dependencies: the system
      # python refuses pip installs (PEP 668).
      # zsh: the evidence steps of the shell gates run it on the host.
      - name: Install strace, zsh and the test dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends strace bindfs fuse3 zsh
          zsh --version
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --require-hashes --only-binary=:all: -r tests/shell/requirements.txt
      # The test skips without strace; here a skip is a failure.
      - name: Calls after the filter are in the table
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m pytest tests/shell/test_prompt_env_paths.py -k after_the_filter -q -rs -p no:cacheprovider | tee "$RUNNER_TEMP/pytest.out"
          grep -q '4 passed' "$RUNNER_TEMP/pytest.out"
      # 이것을 실패시키는 것: 게이트 행 표의 검사를 빼거나 그 skip을 통과로 세는 것.
      - name: Gate acceptance rows map every clause to a CI-asserted test
        run: |
          set -o pipefail
          "$RUNNER_TEMP/venv/bin/python" -m pytest tests/shell/test_gate_acceptance.py -q -rA -p no:cacheprovider | tee "$RUNNER_TEMP/gate-acceptance.txt"
          grep -Fx 'PASSED tests/shell/test_gate_acceptance.py::test_gate_rows_exist_and_run_in_ci' "$RUNNER_TEMP/gate-acceptance.txt"
          grep -Fx 'PASSED tests/shell/test_gate_acceptance.py::test_every_gate_clause_is_a_row_or_pending' "$RUNNER_TEMP/gate-acceptance.txt"
          grep -Fx 'PASSED tests/shell/test_gate_acceptance.py::test_shell_time_job_records_a_verdict' "$RUNNER_TEMP/gate-acceptance.txt"
      # GATE-FS-HELPER.1 counts a release build: the debug cells would measure
      # the debug profile's extra fd checks (the test also refuses a debug binary).
      # 이것을 실패시키는 것: 이 단계를 debug 칸에서도 돌리거나 매개변수 하나의 PASSED 단언을 빼는 것.
      - name: Helper calls per publication stage equal the formula (release)
        if: matrix.profile == 'release'
        run: |
          set -o pipefail
          "$RUNNER_TEMP/venv/bin/python" -m pytest 'tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[unchanged]' 'tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[publish]' 'tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[collect]' 'tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[failure-last-good]' 'tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[failure-recover]' 'tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[command_miss]' 'tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[command_hit]' 'tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[command_not_run]' 'tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[builtin_probe]' 'tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[builtin_fast]' --basetemp="$RUNNER_TEMP/helper-stage-pytest" -q -rA -p no:cacheprovider | tee "$RUNNER_TEMP/helper-stage.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[unchanged]' "$RUNNER_TEMP/helper-stage.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[publish]' "$RUNNER_TEMP/helper-stage.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[collect]' "$RUNNER_TEMP/helper-stage.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[failure-last-good]' "$RUNNER_TEMP/helper-stage.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[failure-recover]' "$RUNNER_TEMP/helper-stage.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[command_miss]' "$RUNNER_TEMP/helper-stage.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[command_hit]' "$RUNNER_TEMP/helper-stage.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[command_not_run]' "$RUNNER_TEMP/helper-stage.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[builtin_probe]' "$RUNNER_TEMP/helper-stage.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[builtin_fast]' "$RUNNER_TEMP/helper-stage.txt"
      # GATE-CMD-SPAWN and GATE-CLOCK-READS.3: command rounds through the real helper,
      # supervisor and relay (release: the collected-root round exceeds the helper's
      # CPU limit in debug builds on slow hosts, as on the base).
