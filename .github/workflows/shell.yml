          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_shell_pipe_reaches_eof_while_helper_is_alive' "$RUNNER_TEMP/fds.txt"
      # The command environment reaches the helper as frame bytes on fd 4, never
      # through envp or as a location. The LD_PRELOAD canary needs the glibc loader.
      # 이것을 실패시키는 것: debug 칸에서 돌리거나 시험 하나의 PASSED 단언을 빼는 것, glibc 칸의 skip을 통과로 세는 것.
      - name: Command environment frame (release)
        if: matrix.profile == 'release'
        run: |
          set -o pipefail
          "$RUNNER_TEMP/venv/bin/python" -m pytest 'tests/shell/test_prompt_env_paths.py::test_ld_preload_not_loaded_into_helper' 'tests/shell/test_prompt_env_paths.py::test_helper_ignores_xdg_runtime_dir_from_env' 'tests/shell/test_prompt_env_paths.py::test_oversize_env_block_means_no_env' --basetemp="$RUNNER_TEMP/env-pytest" -q -rA -p no:cacheprovider | tee "$RUNNER_TEMP/env.txt"
          if [ "$LIBC" = gnu ]; then grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_ld_preload_not_loaded_into_helper' "$RUNNER_TEMP/env.txt"; fi
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_helper_ignores_xdg_runtime_dir_from_env' "$RUNNER_TEMP/env.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_oversize_env_block_means_no_env' "$RUNNER_TEMP/env.txt"
      # The path allowlist with exactly one collecting collector needs a release
      # helper (a debug one under strace often defers admission); the PTY
      # containers run the no-collection cell on their debug build.
      # 이것을 실패시키는 것: 이 단계를 debug 칸에서 돌리거나 매개변수 하나의 PASSED 단언을 빼는 것.
      - name: Prompt path allowlist with one collector (release)
        if: matrix.profile == 'release'
        run: |
          set -o pipefail
          "$RUNNER_TEMP/venv/bin/python" -m pytest 'tests/shell/test_prompt_env_paths.py::test_prompt_binary_names_only_allowed_system_paths_and_pinned_roots[global-missing]' 'tests/shell/test_prompt_env_paths.py::test_prompt_binary_names_only_allowed_system_paths_and_pinned_roots[global-present]' --basetemp="$RUNNER_TEMP/allowlist-pytest" -q -rA -p no:cacheprovider | tee "$RUNNER_TEMP/allowlist.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_prompt_binary_names_only_allowed_system_paths_and_pinned_roots[global-missing]' "$RUNNER_TEMP/allowlist.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_prompt_binary_names_only_allowed_system_paths_and_pinned_roots[global-present]' "$RUNNER_TEMP/allowlist.txt"
      - name: Build runtime path example test (release)
        if: matrix.profile == 'release'
        run: |
          set -o pipefail
          args=(--release)
          if [ "$LIBC" = musl ]; then args+=(--target "$(uname -m)-unknown-linux-musl"); fi
          cargo test -p bingsu --test cli_prompt --no-run "${args[@]}"
      # init warns about an executable path under sticky /tmp, so the fixtures live
      # under RUNNER_TEMP; a failure uploads them with the helper stage evidence.
      - name: Runtime root gates (release)
        if: matrix.profile == 'release'
        run: |
          set -o pipefail
          "$RUNNER_TEMP/venv/bin/python" -m pytest tests/shell/test_runtime_root_gate.py::test_deleted_and_recreated_runtime_root_degrades_every_prompt tests/shell/test_runtime_root_gate.py::test_init_again_recovers_runtime_root tests/shell/test_runtime_root_gate.py::test_runtime_root_path_examples tests/shell/test_zsh_notices.py::test_runtime_root_notice_once_then_reinit_recovers --basetemp="$RUNNER_TEMP/helper-stage-pytest/helper-stage-evidence/runtime-root" -q -rA -p no:cacheprovider | tee "$RUNNER_TEMP/runtime-root.txt"
          grep -Fx 'PASSED tests/shell/test_runtime_root_gate.py::test_deleted_and_recreated_runtime_root_degrades_every_prompt' "$RUNNER_TEMP/runtime-root.txt"
          grep -Fx 'PASSED tests/shell/test_runtime_root_gate.py::test_init_again_recovers_runtime_root' "$RUNNER_TEMP/runtime-root.txt"
          grep -Fx 'PASSED tests/shell/test_runtime_root_gate.py::test_runtime_root_path_examples' "$RUNNER_TEMP/runtime-root.txt"
          grep -Fx 'PASSED tests/shell/test_zsh_notices.py::test_runtime_root_notice_once_then_reinit_recovers' "$RUNNER_TEMP/runtime-root.txt"
      # Shell gates count calls and executed files, so debug and release cells both prove them.
      # 이것을 실패시키는 것: 시험 하나를 실행 목록이나 PASSED 단언에서 빼는 것, strace 시험의 skip을 통과로 세는 것.
      - name: Shell call, exec, redraw and notice gates
        run: |
          set -o pipefail
          "$RUNNER_TEMP/venv/bin/python" -m pytest tests/shell/test_zsh_gates.py::test_zsh_hooks_exec_only_pinned_binary tests/shell/test_zsh_gates.py::test_zsh_call_count_per_prompt tests/shell/test_zsh_gates.py::test_zsh_hooks_run_with_empty_path tests/shell/test_zsh_gates.py::test_zsh_notice_once_across_redraw_transient_vi tests/shell/test_zsh_hooks.py::test_resize_redraws_at_new_width tests/shell/test_zsh_hooks.py::test_same_width_makes_no_call tests/shell/test_zsh_hooks.py::test_winch_burst_ends_at_final_width tests/shell/test_zsh_hooks.py::test_redraw_yields_to_a_key_and_skips_the_same_width tests/shell/test_zsh_hooks.py::test_width_that_keeps_changing_does_not_hold_input tests/shell/test_zsh_hooks.py::test_width_changed_during_a_call_is_drawn --basetemp="$RUNNER_TEMP/shell-gates-pytest" -q -rA -p no:cacheprovider | tee "$RUNNER_TEMP/shell-gates.txt"
          grep -Fx 'PASSED tests/shell/test_zsh_gates.py::test_zsh_hooks_exec_only_pinned_binary' "$RUNNER_TEMP/shell-gates.txt"
          grep -Fx 'PASSED tests/shell/test_zsh_gates.py::test_zsh_call_count_per_prompt' "$RUNNER_TEMP/shell-gates.txt"
          grep -Fx 'PASSED tests/shell/test_zsh_gates.py::test_zsh_hooks_run_with_empty_path' "$RUNNER_TEMP/shell-gates.txt"
          grep -Fx 'PASSED tests/shell/test_zsh_gates.py::test_zsh_notice_once_across_redraw_transient_vi' "$RUNNER_TEMP/shell-gates.txt"
          grep -Fx 'PASSED tests/shell/test_zsh_hooks.py::test_resize_redraws_at_new_width' "$RUNNER_TEMP/shell-gates.txt"
          grep -Fx 'PASSED tests/shell/test_zsh_hooks.py::test_same_width_makes_no_call' "$RUNNER_TEMP/shell-gates.txt"
          grep -Fx 'PASSED tests/shell/test_zsh_hooks.py::test_winch_burst_ends_at_final_width' "$RUNNER_TEMP/shell-gates.txt"
          grep -Fx 'PASSED tests/shell/test_zsh_hooks.py::test_redraw_yields_to_a_key_and_skips_the_same_width' "$RUNNER_TEMP/shell-gates.txt"
          grep -Fx 'PASSED tests/shell/test_zsh_hooks.py::test_width_that_keeps_changing_does_not_hold_input' "$RUNNER_TEMP/shell-gates.txt"
          grep -Fx 'PASSED tests/shell/test_zsh_hooks.py::test_width_changed_during_a_call_is_drawn' "$RUNNER_TEMP/shell-gates.txt"
      # GATE-TRUST-REVOKE.2 on a release build: the config root's FUSE daemon is stopped
      # and the test waits out T (about 60 s) on CLOCK_BOOTTIME. Without FUSE it fails BLOCKED.
      # 이것을 실패시키는 것: 막힌 마운트 신뢰 철회 시험을 빼거나 PASSED 단언 없이 돌리는 것.
      - name: Trust revocation past T on a blocked mount (release)
        if: matrix.profile == 'release'
        run: |
          set -o pipefail
          "$RUNNER_TEMP/venv/bin/python" -m pytest 'tests/shell/test_snapshot_refresh.py::test_chmod_g_w_on_blocked_mount_approves_no_unit_past_t' --basetemp="$RUNNER_TEMP/trust-revoke-pytest" -q -rA -p no:cacheprovider | tee "$RUNNER_TEMP/trust-revoke.txt"
          grep -Fx 'PASSED tests/shell/test_snapshot_refresh.py::test_chmod_g_w_on_blocked_mount_approves_no_unit_past_t' "$RUNNER_TEMP/trust-revoke.txt"
      # Only the live fixture's trace, stdout, stderr and attempt.json.
      - name: Upload failed helper stage evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helper-stage-${{ matrix.os }}-${{ matrix.libc }}-${{ matrix.profile }}
          path: ${{ runner.temp }}/helper-stage-pytest/helper-stage-evidence/
          retention-days: 2
          if-no-files-found: ignore
      - name: Mounted procfs self with a different visible PID
        if: matrix.libc == 'gnu' && matrix.profile == 'debug'
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m pytest tests/shell/test_prompt_proc.py -q -rs -p no:cacheprovider | tee "$RUNNER_TEMP/proc-pytest.out"
          grep -q '1 passed' "$RUNNER_TEMP/proc-pytest.out"

      - name: Previous-response path/facts/chunk gate on native Linux
        if: matrix.libc == 'gnu' && matrix.profile == 'debug'
        run: |
          set -o pipefail
          "$RUNNER_TEMP/venv/bin/python" -m pytest tests/shell/test_collector_response.py -k post_filter_has_no_new_path_or_metadata_effects -q -rA -p no:cacheprovider | tee "$RUNNER_TEMP/collection-reader.txt"
          for mode in absent current previous corrupt; do
            for length in 1 3841 65536; do
              grep -F "PASSED tests/shell/test_collector_response.py::test_post_filter_has_no_new_path_or_metadata_effects[$mode-$length]" "$RUNNER_TEMP/collection-reader.txt"
            done
          done

  b1-children:
    name: Child counts (${{ matrix.os }} ${{ matrix.libc }} release)
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        libc: [gnu, musl]
    env:
      PROFILE: release
      LIBC: ${{ matrix.libc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Build release siblings
        run: |
          arch=$(uname -m)
          target="$arch-unknown-linux-$LIBC"
          rustup target add "$target"
          if [ "$LIBC" = musl ]; then sudo apt-get update -q; sudo apt-get install -y musl-tools; fi
          cargo build -p bingsu -p bingsu-prompt -p bingsu-collect --release --target "$target"
          echo "BINGSU_BIN=$PWD/target/$target/release/bingsu" >> "$GITHUB_ENV"
      - name: Prepare tracing and Python
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends strace
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --require-hashes --only-binary=:all: -r tests/shell/requirements.txt
      # 이것을 실패시키는 것: release live 시험 생략·skip을 PASS로 세는 것.
      - name: Assert B1 release child gates
        run: |
          set -o pipefail
          "$RUNNER_TEMP/venv/bin/python" -m pytest tests/shell/test_prompt_env_paths.py::test_redraw_spawns_no_process_and_reads_no_config_source tests/shell/test_prompt_env_paths.py::test_redraw_renders_new_width_from_same_values tests/shell/test_prompt_env_paths.py::test_live_child_count_is_bounded_per_role tests/shell/test_prompt_env_paths.py::test_live_no_worker_segment_spawns_zero_collectors tests/shell/test_prompt_env_paths.py::test_live_collector_count_ignores_marker_validity tests/shell/test_prompt_env_paths.py::test_live_collector_spawns_after_helper_header_and_marker_reads --basetemp="$RUNNER_TEMP/b1-evidence" -q -rA -p no:cacheprovider | tee "$RUNNER_TEMP/b1.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_redraw_spawns_no_process_and_reads_no_config_source' "$RUNNER_TEMP/b1.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_redraw_renders_new_width_from_same_values' "$RUNNER_TEMP/b1.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_child_count_is_bounded_per_role' "$RUNNER_TEMP/b1.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_no_worker_segment_spawns_zero_collectors' "$RUNNER_TEMP/b1.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_collector_count_ignores_marker_validity' "$RUNNER_TEMP/b1.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_collector_spawns_after_helper_header_and_marker_reads' "$RUNNER_TEMP/b1.txt"
      # 이것을 실패시키는 것: 무효 표식의 Eligibility::units() 단언을 CI에서 생략하는 것.
      - name: Assert invalid marker eligibility
        run: |
          set -o pipefail
          cargo test -p bingsu-core --lib --release | tee "$RUNNER_TEMP/b1-core.txt"
          grep -Fx 'test front::staged::tests::cases::n7_builtin_collection_survives_invalid_marker ... ok' "$RUNNER_TEMP/b1-core.txt"
          grep -Fx 'test front::staged::tests::cases::finish_refuses_units_when_final_clock_reaches_deadline ... ok' "$RUNNER_TEMP/b1-core.txt"
          grep -Fx 'test front::staged::tests::cases::staged_plan_emits_fixed_clock_operations_per_path ... ok' "$RUNNER_TEMP/b1-core.txt"
      - name: Retain B1 failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: b1-${{ matrix.os }}-${{ matrix.libc }}
          path: |
            ${{ runner.temp }}/b1-evidence
            ${{ runner.temp }}/b1.txt

  # zsh, and the required check. shell-macos-shells repeats these steps, without
  # the gate table step, for the other shells; test_gate_acceptance.py keeps the
  # two jobs equal. A matrix here would put the evidence step in three cells.
  shell-macos:
    name: Shell PTY (macOS Homebrew)
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
