          grep -Fx 'PASSED tests/shell/test_gate_acceptance.py::test_every_gate_clause_is_a_row_or_pending' "$RUNNER_TEMP/gate-acceptance.txt"
          grep -Fx 'PASSED tests/shell/test_gate_acceptance.py::test_shell_time_job_records_a_verdict' "$RUNNER_TEMP/gate-acceptance.txt"
          "$RUNNER_TEMP/venv/bin/python" -m pytest tests/shell/test_zsh_gates.py::test_zsh_call_count_per_prompt tests/shell/test_zsh_gates.py::test_zsh_hooks_run_with_empty_path tests/shell/test_zsh_gates.py::test_zsh_notice_once_across_redraw_transient_vi tests/shell/test_zsh_hooks.py::test_resize_redraws_at_new_width tests/shell/test_zsh_hooks.py::test_same_width_makes_no_call tests/shell/test_zsh_hooks.py::test_winch_burst_ends_at_final_width tests/shell/test_zsh_hooks.py::test_redraw_yields_to_a_key_and_skips_the_same_width tests/shell/test_zsh_hooks.py::test_width_that_keeps_changing_does_not_hold_input tests/shell/test_zsh_hooks.py::test_width_changed_during_a_call_is_drawn --basetemp="$RUNNER_TEMP/shell-gates-pytest" -q -rA -p no:cacheprovider | tee "$RUNNER_TEMP/shell-gates.txt"
          grep -Fx 'PASSED tests/shell/test_zsh_gates.py::test_zsh_call_count_per_prompt' "$RUNNER_TEMP/shell-gates.txt"
          grep -Fx 'PASSED tests/shell/test_zsh_gates.py::test_zsh_hooks_run_with_empty_path' "$RUNNER_TEMP/shell-gates.txt"
