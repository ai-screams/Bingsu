name: Shell

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      record_observations:
        description: Print unpinned NUL observations instead of failing (review, then pin in nul_expected.tsv)
        type: boolean
        default: false

permissions:
  contents: read

env:
  BINGSU_RECORD_OBSERVATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.record_observations && '1' || '' }}

concurrency:
  group: shell-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The PTY tests need the bingsu binary; without a Cargo workspace there is
  # nothing to test (same detect step as ci.yml).
  detect:
    name: Detect project
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.check.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: |
          if [ -f Cargo.toml ]; then echo "rust=true" >> "$GITHUB_OUTPUT"; else echo "rust=false" >> "$GITHUB_OUTPUT"; fi

  shell-linux:
    name: Shell PTY (${{ matrix.label }})
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # One cell per shell; a bare image label is that image's required check.
        # tests/shell/test_gate_acceptance.py pins these cells.
        include:
          - label: min-u22
            image: min-u22
            versions: zsh=5.8
            shells: zsh
          - label: min-u22 bash
            image: min-u22
            versions: bash=5.1
            shells: bash
          - label: min-d12
            image: min-d12
            versions: fish=3.6
            shells: fish
          - label: cur-d13
            image: cur-d13
            versions: ""
            shells: zsh
          - label: cur-d13 bash
            image: cur-d13
            versions: ""
            shells: bash
          - label: cur-d13 fish
            image: cur-d13
            versions: ""
            shells: fish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Static musl binary: the runner's glibc is newer than the images'.
      - run: cargo build -p bingsu -p bingsu-prompt -p bingsu-collect --target x86_64-unknown-linux-musl
      # K60 must round-trip through the minimum shells without Cargo in
      # their images. Check the root on the host, but embed the /w mount.
      - name: Generate shape-only init fixture
        run: |
          cargo test -j 2 -p bingsu --bin bingsu --no-run
          fixture=$(mktemp -d "$PWD/target/shape-only-fixture.XXXXXX")
          M3A_FIXTURE_DIR="$fixture" M3A_FIXTURE_ROOT="/w/target/${fixture##*/}" \
            cargo test -j 2 -p bingsu --bin bingsu commands::init::tests::write_shape_only_shell_fixture -- --exact --ignored --test-threads=1
          echo "BINGSU_SHAPE_ONLY_FIXTURE=/w/target/${fixture##*/}" >> "$GITHUB_ENV"
      - run: tests/shell/containers/check-digests.sh
      - run: docker build -f "tests/shell/containers/${{ matrix.image }}.Dockerfile" -t "bingsu-${{ matrix.image }}" tests/shell/containers
      - name: Assert minimum versions
        if: matrix.versions != ''
        run: docker run --rm -v "$PWD:/w" -w /w "bingsu-${{ matrix.image }}" python3 tests/shell/check_versions.py ${{ matrix.versions }}
      - name: Record shell versions
        run: |
          { echo "### ${{ matrix.image }} shell versions"; echo; echo '```'
            docker run --rm -v "$PWD:/w" -w /w "bingsu-${{ matrix.image }}" python3 tests/shell/check_versions.py --record
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Record golden vectors
        run: |
          docker run --rm -v "$PWD:/w" -w /w -e PYTHONDONTWRITEBYTECODE=1 -e BINGSU_RECORD_OBSERVATIONS -e SHELLS="${{ matrix.shells }}" -e LOCALES="C.UTF-8 C ko_KR.UTF-8" \
            "bingsu-${{ matrix.image }}" tests/golden/record/run-all.sh
      # Runs after a golden failure too, so one failure does not hide the other.
      # The runner's uid owns the checkout and the binary, and the container
      # runs as root: init would warn that a folder above the binary can be
      # changed by another user (Install.init fails on any init warning). A
      # root-owned copy in /usr/local/bin is what an installed bingsu looks
      # like; --user would need a passwd entry, which init reads for the home.
      # All three images exclude M3b security: no host preparation for the
      # installed pair. The dedicated native collector job prepares and runs it.
      # The release live gates run in filter-calls; the helper lifetime,
      # zombie and shell-pipe EOF gates also need a FUSE mount these
      # containers do not have.
      # The test folders live in /root, not in /tmp: init warns about the
      # world-writable /tmp above an executable symlink there as well.
      # Two files do not depend on the shell or the image: the step below runs
      # test_prompt_trace_budget.py once, and the gate table steps of
      # filter-calls and shell-macos run test_gate_acceptance.py.
      - name: Fetch the pinned oh-my-zsh
        # As the PTY step: a failed step before it must not leave the tree out.
        if: success() || failure()
        run: |
          read -r commit < tests/shell/ohmyzsh.pin
          # The Rust cache can restore this folder from an earlier run.
          rm -rf target/ohmyzsh
          git init -q target/ohmyzsh
          for _ in 1 2 3; do
            git -C target/ohmyzsh fetch -q --depth 1 https://github.com/ohmyzsh/ohmyzsh.git "$commit" && break
            sleep 5
          done
          { git -C target/ohmyzsh checkout -q --detach FETCH_HEAD &&
            [ "$(git -C target/ohmyzsh rev-parse HEAD)" = "$commit" ]; } ||
            echo "::warning::oh-my-zsh fetch failed; its tests fail as BLOCKED"
      - name: PTY tests
        if: success() || failure()
        run: |
          # test_command_round.py runs in the filter-calls release step and the
          # macOS gate step, where every test it selects is asserted as passed.
          # While recording (record_observations), -s shows the OBSERVE-PTY lines in the job log.
          docker run --rm --cap-add SYS_PTRACE -v "$PWD:/w" -w /w \
            -e BINGSU_BIN=/usr/local/bin/bingsu -e PYTHONDONTWRITEBYTECODE=1 \
            -e CI=true -e BINGSU_SHAPE_ONLY_FIXTURE \
            -e BINGSU_TEST_SHELLS="${{ matrix.shells }}" -e BINGSU_RECORD_OBSERVATIONS -e LC_ALL=C.UTF-8 \
            "bingsu-${{ matrix.image }}" sh -c 'install -m 0755 target/x86_64-unknown-linux-musl/debug/bingsu target/x86_64-unknown-linux-musl/debug/bingsu-prompt target/x86_64-unknown-linux-musl/debug/bingsu-collect /usr/local/bin/ &&
              exec python3 -m pytest tests/shell tests/golden/record/test_overrides.py tests/golden/record/test_mixed_versions.py -q -rf -p no:cacheprovider --basetemp=/root/pytest \
                --ignore tests/shell/test_collector_no_spawn_macos.py \
                --ignore tests/shell/test_collector_security.py \
                --ignore tests/shell/test_gate_acceptance.py \
                --ignore tests/shell/test_prompt_trace_budget.py \
                --ignore tests/shell/test_command_round.py \
                --ignore tests/shell/test_builtin_round.py \
                --ignore tests/shell/test_command_cgroup.py \
                --durations=0 --durations-min=0.1 \
                --deselect tests/shell/test_display_words.py::test_fish_long_cwd_is_passed_empty \
                --deselect tests/shell/test_runtime_root_gate.py::test_runtime_root_path_examples \
                --deselect tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula \
                --deselect tests/shell/test_prompt_env_paths.py::test_live_helper_stops_config_io_past_an_axis_cap \
                --deselect "tests/shell/test_prompt_env_paths.py::test_prompt_binary_names_only_allowed_system_paths_and_pinned_roots[global-missing]" \
                --deselect "tests/shell/test_prompt_env_paths.py::test_prompt_binary_names_only_allowed_system_paths_and_pinned_roots[global-present]" \
                --deselect tests/shell/test_prompt_env_paths.py::test_live_front_attempts_match_axis_c \
                --deselect tests/shell/test_prompt_env_paths.py::test_front_never_reads_trust_metadata_section \
                --deselect tests/shell/test_prompt_env_paths.py::test_live_front_command_response_shapes \
                --deselect tests/shell/test_helper_lifecycle.py::test_helper_requests_kill_after_deadline_on_normal_and_blocked_mount \
                --deselect tests/shell/test_helper_lifecycle.py::test_one_blocked_helper_per_context_after_lock \
                --deselect tests/shell/test_collector_lifecycle.py::test_n_prompts_leave_zero_zombies_including_killed_children \
                --deselect tests/shell/test_prompt_env_paths.py::test_helper_fds_after_env \
                --deselect tests/shell/test_prompt_env_paths.py::test_live_collector_holds_only_fixed_fds \
                --deselect tests/shell/test_prompt_env_paths.py::test_shell_pipe_reaches_eof_while_helper_is_alive \
                --deselect tests/shell/test_prompt_env_paths.py::test_ld_preload_not_loaded_into_helper \
                --deselect tests/shell/test_prompt_env_paths.py::test_helper_ignores_xdg_runtime_dir_from_env \
                --deselect tests/shell/test_prompt_env_paths.py::test_oversize_env_block_means_no_env \
                --deselect tests/shell/test_snapshot_refresh.py::test_chmod_g_w_on_blocked_mount_approves_no_unit_past_t "$@"' sh ${BINGSU_RECORD_OBSERVATIONS:+-s}
      # Python only: recorded traces and the workflow files, no shell and no binary.
      # 이것을 실패시키는 것: 이 파일을 다른 칸으로 옮기거나 빼는 것, skip을 통과로 세는 것.
      - name: Shell-independent tests
        if: (success() || failure()) && matrix.image == 'min-d12'
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/w" -w /w -e PYTHONDONTWRITEBYTECODE=1 -e LC_ALL=C.UTF-8 "bingsu-${{ matrix.image }}" \
            python3 -m pytest tests/shell/test_prompt_trace_budget.py -q -rf -p no:cacheprovider --basetemp=/root/pytest \
            --durations=0 --durations-min=0.1 | tee "$RUNNER_TEMP/shell-independent.txt"
          grep -Eq '^[0-9]+ passed in ' "$RUNNER_TEMP/shell-independent.txt"
      # The one test that needs a folder deeper than 64 KiB. Docker's default
      # AppArmor profile refuses paths over about 8 KB (mkdir stops at depth
      # 40), so this test alone runs in its own container without that
      # profile; the PTY tests above keep it.
      - name: Long folder test (AppArmor unconfined)
        if: success() || failure()
        run: |
          docker run --rm --security-opt apparmor=unconfined -v "$PWD:/w" -w /w \
            -e BINGSU_BIN=/usr/local/bin/bingsu -e PYTHONDONTWRITEBYTECODE=1 \
            -e BINGSU_TEST_SHELLS="${{ matrix.shells }}" -e LC_ALL=C.UTF-8 \
            "bingsu-${{ matrix.image }}" sh -c 'install -m 0755 target/x86_64-unknown-linux-musl/debug/bingsu target/x86_64-unknown-linux-musl/debug/bingsu-prompt target/x86_64-unknown-linux-musl/debug/bingsu-collect /usr/local/bin/ &&
              exec python3 -m pytest tests/shell/test_display_words.py::test_fish_long_cwd_is_passed_empty -q -rs -p no:cacheprovider --basetemp=/root/pytest'

  # M6 C3: the command cgroup layer in two cells. The default container
  # refuses child cgroups (X-04's negative cell: the capability check picks
  # the best-effort path); the privileged one has the atomic path, where
  # every test below must really run (the tests fail rather than skip there).
  # tests/shell/test_gate_acceptance.py pins the cells and the asserted tests.
  command-cgroup:
    name: Command cgroup cell (${{ matrix.cell }})
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: plain
            opts: ""
          - cell: priv
            opts: --privileged --cgroupns=private
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Static musl binaries run in any image.
      - name: Build the cell binaries
        run: |
          set -o pipefail
          cargo build --release -p bingsu -p bingsu-prompt -p bingsu-collect --target x86_64-unknown-linux-musl
          # version-stub: the builtin language rounds' command (D3a).
          cargo build --release -p bingsu-bench --bin version-stub --target x86_64-unknown-linux-musl
          cargo test -p bingsu --bin bingsu --target x86_64-unknown-linux-musl --no-run --message-format=json | jq -r 'select(.profile.test == true and .executable != null) | .executable' > "$RUNNER_TEMP/cell-bin"
      - run: tests/shell/containers/check-digests.sh
      - run: docker build -f tests/shell/containers/cgroup-d13.Dockerfile -t bingsu-cgroup-d13 tests/shell/containers
      # X-04: whether this runner gives the cell a delegated cgroup (recorded, not asserted).
      - name: Record the X-04 line
        run: |
          { echo "### X-04 (${{ matrix.cell }})"; echo '```'; uname -r; cat /proc/self/cgroup
            docker run --rm ${{ matrix.opts }} bingsu-cgroup-d13 sh -c 'cat /proc/self/cgroup; d=/sys/fs/cgroup$(cut -c4- /proc/self/cgroup); if mkdir "$d/x04"; then echo "child cgroup: made"; rmdir "$d/x04"; else echo "child cgroup: refused"; fi'
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Rust tests in the cell
        run: |
          set -o pipefail
          docker run --rm ${{ matrix.opts }} -e BINGSU_CGROUP_CELL=${{ matrix.cell }} -v "$(cat "$RUNNER_TEMP/cell-bin"):/cell:ro" bingsu-cgroup-d13 /cell --include-ignored --exact --test-threads=1 commands::command_cgroup::cell::test_capability_matches_the_cell commands::command_cgroup::cell::test_capability_refuses_a_foreign_parent commands::command_cgroup::cell::test_capability_needs_its_own_cgroup commands::command_cgroup::cell::test_gc_own_cgroup_needs_its_own_cgroup commands::command_cgroup::cell::test_capability_refuses_an_unremounted_namespace commands::command_cgroup::cell::test_capability_refuses_a_bind_mounted_parent commands::command_cgroup::cell::test_capability_refuses_a_foreign_parent_mounted_over_its_name commands::command_cgroup::cell::test_reclaim_never_enters_a_cgroup_mounted_below commands::command_cgroup::cell::test_kill_file_refuses_a_file_bind_mounted_over_it commands::command_cgroup::cell::test_a_folder_bound_below_the_parent_is_not_its_child commands::command_cgroup::cell::fs_reclaim_kills_and_removes_a_nested_tree commands::command_process::tests::test_clone3_relay_gets_exactly_four_fds commands::command_process::tests::test_clone3_exec_failure_is_reported commands::command_process::tests::test_clone3_waits_for_go commands::command_process::tests::test_clone3_starts_inside_the_cgroup commands::command_supervisor::tests::test_setsid_descendant_killed_with_cgroup commands::command_supervisor::tests::test_setsid_descendant_of_an_exited_target_killed commands::command_supervisor::tests::test_nested_cgroup_removed_postorder commands::command_supervisor::tests::test_cgroup_names_never_reused commands::command_supervisor::tests::test_supervisor_detects_helper_death_without_output_in_cgroup commands::command_supervisor::tests::test_existing_unit_name_is_never_reused commands::command_supervisor::tests::test_clone3_refusal_takes_the_best_effort_path | tee "$RUNNER_TEMP/cell-rust.txt"
          grep -Fx 'test commands::command_cgroup::cell::test_capability_matches_the_cell ... ok' "$RUNNER_TEMP/cell-rust.txt"
          grep -Fx 'test commands::command_cgroup::cell::test_capability_refuses_a_foreign_parent ... ok' "$RUNNER_TEMP/cell-rust.txt"
          grep -Fx 'test commands::command_cgroup::cell::test_capability_needs_its_own_cgroup ... ok' "$RUNNER_TEMP/cell-rust.txt"
          grep -Fx 'test commands::command_cgroup::cell::test_gc_own_cgroup_needs_its_own_cgroup ... ok' "$RUNNER_TEMP/cell-rust.txt"
          grep -Fx 'test commands::command_cgroup::cell::test_capability_refuses_an_unremounted_namespace ... ok' "$RUNNER_TEMP/cell-rust.txt"
          grep -Fx 'test commands::command_cgroup::cell::test_capability_refuses_a_bind_mounted_parent ... ok' "$RUNNER_TEMP/cell-rust.txt"
          grep -Fx 'test commands::command_cgroup::cell::test_capability_refuses_a_foreign_parent_mounted_over_its_name ... ok' "$RUNNER_TEMP/cell-rust.txt"
          grep -Fx 'test commands::command_cgroup::cell::test_reclaim_never_enters_a_cgroup_mounted_below ... ok' "$RUNNER_TEMP/cell-rust.txt"
          grep -Fx 'test commands::command_cgroup::cell::test_kill_file_refuses_a_file_bind_mounted_over_it ... ok' "$RUNNER_TEMP/cell-rust.txt"
          grep -Fx 'test commands::command_cgroup::cell::test_a_folder_bound_below_the_parent_is_not_its_child ... ok' "$RUNNER_TEMP/cell-rust.txt"
          grep -Fx 'test commands::command_cgroup::cell::fs_reclaim_kills_and_removes_a_nested_tree ... ok' "$RUNNER_TEMP/cell-rust.txt"
          grep -Fx 'test commands::command_process::tests::test_clone3_relay_gets_exactly_four_fds ... ok' "$RUNNER_TEMP/cell-rust.txt"
          grep -Fx 'test commands::command_process::tests::test_clone3_exec_failure_is_reported ... ok' "$RUNNER_TEMP/cell-rust.txt"
          grep -Fx 'test commands::command_process::tests::test_clone3_waits_for_go ... ok' "$RUNNER_TEMP/cell-rust.txt"
          grep -Fx 'test commands::command_process::tests::test_clone3_starts_inside_the_cgroup ... ok' "$RUNNER_TEMP/cell-rust.txt"
          grep -Fx 'test commands::command_supervisor::tests::test_setsid_descendant_killed_with_cgroup ... ok' "$RUNNER_TEMP/cell-rust.txt"
          grep -Fx 'test commands::command_supervisor::tests::test_setsid_descendant_of_an_exited_target_killed ... ok' "$RUNNER_TEMP/cell-rust.txt"
          grep -Fx 'test commands::command_supervisor::tests::test_nested_cgroup_removed_postorder ... ok' "$RUNNER_TEMP/cell-rust.txt"
          grep -Fx 'test commands::command_supervisor::tests::test_cgroup_names_never_reused ... ok' "$RUNNER_TEMP/cell-rust.txt"
          grep -Fx 'test commands::command_supervisor::tests::test_supervisor_detects_helper_death_without_output_in_cgroup ... ok' "$RUNNER_TEMP/cell-rust.txt"
          grep -Fx 'test commands::command_supervisor::tests::test_existing_unit_name_is_never_reused ... ok' "$RUNNER_TEMP/cell-rust.txt"
          grep -Fx 'test commands::command_supervisor::tests::test_clone3_refusal_takes_the_best_effort_path ... ok' "$RUNNER_TEMP/cell-rust.txt"
      # The prompt tests run as root with a root-owned copy (init warns about
      # a folder above the binary that another user can change).
      - name: Command cgroup tests in the cell
        if: success() || failure()
        run: |
          set -o pipefail
          docker run --rm ${{ matrix.opts }} -e BINGSU_CGROUP_CELL=${{ matrix.cell }} -e BINGSU_BIN=/usr/local/bin/bingsu -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD:/w" -w /w bingsu-cgroup-d13 sh -c 'install -m 0755 target/x86_64-unknown-linux-musl/release/bingsu target/x86_64-unknown-linux-musl/release/bingsu-prompt target/x86_64-unknown-linux-musl/release/bingsu-collect target/x86_64-unknown-linux-musl/release/version-stub /usr/local/bin/ && exec python3 -m pytest tests/shell/test_command_cgroup.py -q -rA -p no:cacheprovider --basetemp=/root/pytest' | tee "$RUNNER_TEMP/cell-py.txt"
          grep -Fx 'PASSED tests/shell/test_command_cgroup.py::test_best_effort_group_kill_under_the_filter' "$RUNNER_TEMP/cell-py.txt"
      # GATE-FS-HELPER.1 command stages, x86_64 musl release: the privileged cell
      # takes the atomic path (its fixture requires the session's cgroup parent),
      # the plain cell the best-effort one.
      # 이것을 실패시키는 것: 이 단계를 빼거나 한 칸에서만 돌리는 것, 단계 하나의 PASSED 단언을 빼는 것.
      - name: Helper calls of command rounds in the cell
        if: success() || failure()
        run: |
          set -o pipefail
          docker run --rm ${{ matrix.opts }} --cap-add SYS_PTRACE -e BINGSU_CGROUP_CELL=${{ matrix.cell }} -e BINGSU_BIN=/usr/local/bin/bingsu -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD:/w" -w /w bingsu-cgroup-d13 sh -c 'install -m 0755 target/x86_64-unknown-linux-musl/release/bingsu target/x86_64-unknown-linux-musl/release/bingsu-prompt target/x86_64-unknown-linux-musl/release/bingsu-collect target/x86_64-unknown-linux-musl/release/version-stub /usr/local/bin/ && exec python3 -m pytest tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula -k "command or builtin" -q -rA -p no:cacheprovider --basetemp=/root/pytest-helper' | tee "$RUNNER_TEMP/cell-helper.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[command_miss]' "$RUNNER_TEMP/cell-helper.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[command_hit]' "$RUNNER_TEMP/cell-helper.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[command_not_run]' "$RUNNER_TEMP/cell-helper.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[builtin_probe]' "$RUNNER_TEMP/cell-helper.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[builtin_fast]' "$RUNNER_TEMP/cell-helper.txt"
      # The survivor fixture depends on the kernel and FUSE: a skip there is
      # BLOCKED and recorded, not failed (plan C3, X-04).
      - name: Record the survivor fixture result
        if: success() || failure()
        run: |
          { echo "### Command cgroup tests (${{ matrix.cell }})"; echo '```'; grep -E '^(PASSED|SKIPPED|FAILED|ERROR)' "$RUNNER_TEMP/cell-py.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # 이것을 실패시키는 것: 특권 칸의 PASSED 단언 하나를 빼는 것, 원자 경로 시험이 skip인 채 통과하는 것.
      - name: Every atomic-path test passed (privileged cell)
        if: matrix.cell == 'priv'
        run: |
          grep -Fx 'PASSED tests/shell/test_command_cgroup.py::test_reclaim_after_supervisor_sigkill' "$RUNNER_TEMP/cell-py.txt"
          grep -Fx 'PASSED tests/shell/test_command_cgroup.py::test_round_removes_its_own_cgroups' "$RUNNER_TEMP/cell-py.txt"
          grep -Fx 'PASSED tests/shell/test_command_cgroup.py::test_reclaim_never_touches_live_supervisor' "$RUNNER_TEMP/cell-py.txt"
          grep -Fx 'PASSED tests/shell/test_command_cgroup.py::test_runtime_roots_never_share_a_cgroup_parent' "$RUNNER_TEMP/cell-py.txt"
          grep -Fx 'PASSED tests/shell/test_command_cgroup.py::test_round_end_reclaims_only_after_the_supervisor_is_reaped' "$RUNNER_TEMP/cell-py.txt"
          grep -Fx 'PASSED tests/shell/test_command_cgroup.py::test_reclaim_runs_before_the_neutral_check' "$RUNNER_TEMP/cell-py.txt"
          grep -Fx 'PASSED tests/shell/test_command_cgroup.py::test_supervisor_keeps_its_cgroup_parent_from_children' "$RUNNER_TEMP/cell-py.txt"
