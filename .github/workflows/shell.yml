name: Shell

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      record_observations:
        description: Print unpinned NUL observations instead of failing (review, then pin in nul_expected.tsv)
        type: boolean
        default: false

permissions:
  contents: read

env:
  BINGSU_RECORD_OBSERVATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.record_observations && '1' || '' }}

concurrency:
  group: shell-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The PTY tests need the bingsu binary; without a Cargo workspace there is
  # nothing to test (same detect step as ci.yml).
  detect:
    name: Detect project
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.check.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: |
          if [ -f Cargo.toml ]; then echo "rust=true" >> "$GITHUB_OUTPUT"; else echo "rust=false" >> "$GITHUB_OUTPUT"; fi

  shell-linux:
    name: Shell PTY (${{ matrix.image }})
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: min-u22
            versions: bash=5.1 zsh=5.8
            shells: bash zsh
          - image: min-d12
            versions: fish=3.6
            shells: fish
          - image: cur-d13
            versions: ""
            shells: bash zsh fish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Static musl binary: the runner's glibc is newer than the images'.
      - run: cargo build -p bingsu -p bingsu-collect --target x86_64-unknown-linux-musl
      # K60 must round-trip through the minimum shells without Cargo in
      # their images. Check the root on the host, but embed the /w mount.
      - name: Generate shape-only init fixture
        run: |
          cargo test -j 2 -p bingsu --bin bingsu --no-run
          fixture=$(mktemp -d "$PWD/target/shape-only-fixture.XXXXXX")
          M3A_FIXTURE_DIR="$fixture" M3A_FIXTURE_ROOT="/w/target/${fixture##*/}" \
            cargo test -j 2 -p bingsu --bin bingsu commands::init::tests::write_shape_only_shell_fixture -- --exact --ignored --test-threads=1
          echo "BINGSU_SHAPE_ONLY_FIXTURE=/w/target/${fixture##*/}" >> "$GITHUB_ENV"
      - run: tests/shell/containers/check-digests.sh
      - run: docker build -f "tests/shell/containers/${{ matrix.image }}.Dockerfile" -t "bingsu-${{ matrix.image }}" tests/shell/containers
      - name: Assert minimum versions
        if: matrix.versions != ''
        run: docker run --rm -v "$PWD:/w" -w /w "bingsu-${{ matrix.image }}" python3 tests/shell/check_versions.py ${{ matrix.versions }}
      - name: Record shell versions
        run: |
          { echo "### ${{ matrix.image }} shell versions"; echo; echo '```'
            docker run --rm -v "$PWD:/w" -w /w "bingsu-${{ matrix.image }}" python3 tests/shell/check_versions.py --record
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Record golden vectors
        run: |
          docker run --rm -v "$PWD:/w" -w /w -e PYTHONDONTWRITEBYTECODE=1 -e BINGSU_RECORD_OBSERVATIONS -e SHELLS="${{ matrix.shells }}" -e LOCALES="C.UTF-8 C ko_KR.UTF-8" \
            "bingsu-${{ matrix.image }}" tests/golden/record/run-all.sh
      # Runs after a golden failure too, so one failure does not hide the other.
      # The runner's uid owns the checkout and the binary, and the container
      # runs as root: init would warn that a folder above the binary can be
      # changed by another user (Install.init fails on any init warning). A
      # root-owned copy in /usr/local/bin is what an installed bingsu looks
      # like; --user would need a passwd entry, which init reads for the home.
      # All three images exclude M3b security: no host preparation for the
      # installed pair. The dedicated native collector job prepares and runs it.
      # The release live gates run in filter-calls; the helper lifetime,
      # zombie and shell-pipe EOF gates also need a FUSE mount these
      # containers do not have.
      # The test folders live in /root, not in /tmp: init warns about the
      # world-writable /tmp above an executable symlink there as well.
      - name: PTY tests
        if: success() || failure()
        run: |
          # While recording (record_observations), -s shows the OBSERVE-PTY lines in the job log.
          docker run --rm --cap-add SYS_PTRACE -v "$PWD:/w" -w /w \
            -e BINGSU_BIN=/usr/local/bin/bingsu -e PYTHONDONTWRITEBYTECODE=1 \
            -e CI=true -e BINGSU_SHAPE_ONLY_FIXTURE \
            -e BINGSU_TEST_SHELLS="${{ matrix.shells }}" -e BINGSU_RECORD_OBSERVATIONS -e LC_ALL=C.UTF-8 \
            "bingsu-${{ matrix.image }}" sh -c 'install -m 0755 target/x86_64-unknown-linux-musl/debug/bingsu target/x86_64-unknown-linux-musl/debug/bingsu-collect /usr/local/bin/ &&
              exec python3 -m pytest tests/shell tests/golden/record/test_overrides.py tests/golden/record/test_mixed_versions.py -q -rf -p no:cacheprovider --basetemp=/root/pytest \
                --ignore tests/shell/test_collector_no_spawn_macos.py \
                --ignore tests/shell/test_collector_security.py \
                --deselect tests/shell/test_display_words.py::test_fish_long_cwd_is_passed_empty \
                --deselect tests/shell/test_runtime_root_gate.py::test_runtime_root_path_examples \
                --deselect tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula \
                --deselect "tests/shell/test_prompt_env_paths.py::test_prompt_binary_names_only_allowed_system_paths_and_pinned_roots[global-missing]" \
                --deselect "tests/shell/test_prompt_env_paths.py::test_prompt_binary_names_only_allowed_system_paths_and_pinned_roots[global-present]" \
                --deselect tests/shell/test_prompt_env_paths.py::test_live_front_attempts_match_axis_c \
                --deselect tests/shell/test_prompt_env_paths.py::test_front_never_reads_trust_metadata_section \
                --deselect tests/shell/test_helper_lifecycle.py::test_helper_requests_kill_after_deadline_on_normal_and_blocked_mount \
                --deselect tests/shell/test_helper_lifecycle.py::test_one_blocked_helper_per_context_after_lock \
                --deselect tests/shell/test_collector_lifecycle.py::test_n_prompts_leave_zero_zombies_including_killed_children \
                --deselect tests/shell/test_prompt_env_paths.py::test_live_helper_execs_with_only_dev_null_stdio \
                --deselect tests/shell/test_prompt_env_paths.py::test_live_collector_holds_only_fixed_fds \
                --deselect tests/shell/test_prompt_env_paths.py::test_shell_pipe_reaches_eof_while_helper_is_alive \
                --deselect tests/shell/test_snapshot_refresh.py::test_chmod_g_w_on_blocked_mount_approves_no_unit_past_t "$@"' sh ${BINGSU_RECORD_OBSERVATIONS:+-s}
      # The one test that needs a folder deeper than 64 KiB. Docker's default
      # AppArmor profile refuses paths over about 8 KB (mkdir stops at depth
      # 40), so this test alone runs in its own container without that
      # profile; the PTY tests above keep it.
      - name: Long folder test (AppArmor unconfined)
        if: success() || failure()
        run: |
          docker run --rm --security-opt apparmor=unconfined -v "$PWD:/w" -w /w \
            -e BINGSU_BIN=/usr/local/bin/bingsu -e PYTHONDONTWRITEBYTECODE=1 \
            -e BINGSU_TEST_SHELLS="${{ matrix.shells }}" -e LC_ALL=C.UTF-8 \
            "bingsu-${{ matrix.image }}" sh -c 'install -m 0755 target/x86_64-unknown-linux-musl/debug/bingsu target/x86_64-unknown-linux-musl/debug/bingsu-collect /usr/local/bin/ &&
              exec python3 -m pytest tests/shell/test_display_words.py::test_fish_long_cwd_is_passed_empty -q -rs -p no:cacheprovider --basetemp=/root/pytest'

  # Every system call the prompt makes after its seccomp filter is installed
  # is a row of crates/bingsu/prompt-syscalls.tsv and none is refused
  # (tests/shell/test_prompt_env_paths.py::test_calls_after_the_filter_are_in_the_table),
  # for each x86_64 libc and profile the release ships or tests run, plus the
  # aarch64 release cells the helper stage gate needs. The binary runs
  # natively on the runner (no container: the runner's own glibc).
  filter-calls:
    # Selects individual shell modules below, never test_collector_security.py;
    # the dedicated collector job owns host preparation and security evidence.
    name: Prompt filter calls (${{ matrix.os }} ${{ matrix.libc }} ${{ matrix.profile }})
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        libc: [gnu, musl]
        profile: [debug, release]
        # GATE-FS-HELPER.1 counts x86_64 and aarch64, glibc and musl, release.
        include:
          - os: ubuntu-24.04-arm
            libc: gnu
            profile: release
          - os: ubuntu-24.04-arm
            libc: musl
            profile: release
    env:
      LIBC: ${{ matrix.libc }}
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.os }}-${{ matrix.libc }}-${{ matrix.profile }}
      - name: Build
        run: |
          args=(-p bingsu -p bingsu-collect)
          dir=target
          if [ "$PROFILE" = release ]; then args+=(--release); fi
          if [ "$LIBC" = musl ]; then musl="$(uname -m)-unknown-linux-musl"; args+=(--target "$musl"); dir="target/$musl"; fi
          cargo build "${args[@]}"
          echo "BINGSU_BIN=$PWD/$dir/$PROFILE/bingsu" >> "$GITHUB_ENV"
      # K82 uses a glibc test binary with LD_PRELOAD; C3 uses a main-thread
      # reader target. Build both before pytest (shell tests never compile).
      - name: Build procfs test profile
        if: matrix.libc == 'gnu' && matrix.profile == 'debug'
        run: cargo test -j 2 -p bingsu --bin bingsu --test collection_reader --test cli_prompt --no-run
      # strace, and a venv with the hash-pinned test dependencies: the system
      # python refuses pip installs (PEP 668).
      - name: Install strace and the test dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends strace bindfs fuse3
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --require-hashes --only-binary=:all: -r tests/shell/requirements.txt
      # The test skips without strace; here a skip is a failure.
      - name: Calls after the filter are in the table
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m pytest tests/shell/test_prompt_env_paths.py -k after_the_filter -q -rs -p no:cacheprovider | tee "$RUNNER_TEMP/pytest.out"
          grep -q '2 passed' "$RUNNER_TEMP/pytest.out"
      # 이것을 실패시키는 것: 게이트 행 표의 검사를 빼거나 그 skip을 통과로 세는 것.
      - name: Gate acceptance rows map every clause to a CI-asserted test
        run: |
          set -o pipefail
          "$RUNNER_TEMP/venv/bin/python" -m pytest tests/shell/test_gate_acceptance.py -q -rA -p no:cacheprovider | tee "$RUNNER_TEMP/gate-acceptance.txt"
          grep -Fx 'PASSED tests/shell/test_gate_acceptance.py::test_gate_rows_exist_and_run_in_ci' "$RUNNER_TEMP/gate-acceptance.txt"
          grep -Fx 'PASSED tests/shell/test_gate_acceptance.py::test_every_gate_clause_is_a_row_or_pending' "$RUNNER_TEMP/gate-acceptance.txt"
      # GATE-FS-HELPER.1 counts a release build: the debug cells would measure
      # the debug profile's extra fd checks (the test also refuses a debug binary).
      # 이것을 실패시키는 것: 이 단계를 debug 칸에서도 돌리거나 매개변수 하나의 PASSED 단언을 빼는 것.
      - name: Helper calls per publication stage equal the formula (release)
        if: matrix.profile == 'release'
        run: |
          set -o pipefail
          "$RUNNER_TEMP/venv/bin/python" -m pytest 'tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[unchanged]' 'tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[publish]' 'tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[collect]' 'tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[failure-last-good]' 'tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[failure-recover]' --basetemp="$RUNNER_TEMP/helper-stage-pytest" -q -rA -p no:cacheprovider | tee "$RUNNER_TEMP/helper-stage.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[unchanged]' "$RUNNER_TEMP/helper-stage.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[publish]' "$RUNNER_TEMP/helper-stage.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[collect]' "$RUNNER_TEMP/helper-stage.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[failure-last-good]' "$RUNNER_TEMP/helper-stage.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_helper_calls_match_stage_formula[failure-recover]' "$RUNNER_TEMP/helper-stage.txt"
      # GATE-FS-HELPER.2 on a release build: past an axis cap the helper's round ends
      # closed and no config source call follows the crossing.
      # 이것을 실패시키는 것: 이 단계를 빼거나 debug 칸에서만 돌리거나 PASSED 단언을 빼는 것.
      - name: Helper axis caps fail closed (release)
        if: matrix.profile == 'release'
        run: |
          set -o pipefail
          "$RUNNER_TEMP/venv/bin/python" -m pytest 'tests/shell/test_prompt_env_paths.py::test_live_helper_stops_config_io_past_an_axis_cap' 'tests/shell/test_prompt_env_paths.py::test_helper_e_n_cap_matches_product_constant' --basetemp="$RUNNER_TEMP/helper-stage-pytest/helper-stage-evidence/axis-cap" -q -rA -p no:cacheprovider | tee "$RUNNER_TEMP/axis-cap.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_helper_stops_config_io_past_an_axis_cap' "$RUNNER_TEMP/axis-cap.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_helper_e_n_cap_matches_product_constant' "$RUNNER_TEMP/axis-cap.txt"
      # 이것을 실패시키는 것: debug 칸에서 계수하거나 매개변수 하나의 PASSED 단언을 빼는 것.
      - name: Front attempts equal axis C and byte formulas (release)
        if: matrix.profile == 'release'
        run: |
          set -o pipefail
          "$RUNNER_TEMP/venv/bin/python" -m pytest 'tests/shell/test_prompt_env_paths.py::test_live_front_attempts_match_axis_c[normal]' 'tests/shell/test_prompt_env_paths.py::test_live_front_attempts_match_axis_c[checksum-last-good]' 'tests/shell/test_prompt_env_paths.py::test_live_front_attempts_match_axis_c[body-limit]' 'tests/shell/test_prompt_env_paths.py::test_live_front_attempts_match_axis_c[header-only]' 'tests/shell/test_prompt_env_paths.py::test_front_never_reads_trust_metadata_section' 'tests/shell/test_prompt_env_paths.py::test_front_chunk_matches_product_constant' --basetemp="$RUNNER_TEMP/helper-stage-pytest/helper-stage-evidence/front" -q -rA -p no:cacheprovider | tee "$RUNNER_TEMP/front.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_front_attempts_match_axis_c[normal]' "$RUNNER_TEMP/front.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_front_attempts_match_axis_c[checksum-last-good]' "$RUNNER_TEMP/front.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_front_attempts_match_axis_c[body-limit]' "$RUNNER_TEMP/front.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_front_attempts_match_axis_c[header-only]' "$RUNNER_TEMP/front.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_front_never_reads_trust_metadata_section' "$RUNNER_TEMP/front.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_front_chunk_matches_product_constant' "$RUNNER_TEMP/front.txt"
      # GATE-HELPER-LIFETIME.1/.3 and GATE-ZOMBIES.1 on a release build. The
      # blocked-mount cases stop a bindfs daemon; a host that cannot mount FUSE
      # fails here with BLOCKED instead of skipping.
      # 이것을 실패시키는 것: debug 칸에서 돌리거나 매개변수 하나의 PASSED 단언을 빼는 것.
      - name: Helper lifetime, lock and zombie census (release)
        if: matrix.profile == 'release'
        run: |
          set -o pipefail
          "$RUNNER_TEMP/venv/bin/python" -m pytest 'tests/shell/test_helper_lifecycle.py::test_helper_requests_kill_after_deadline_on_normal_and_blocked_mount[normal]' 'tests/shell/test_helper_lifecycle.py::test_helper_requests_kill_after_deadline_on_normal_and_blocked_mount[blocked-mount]' 'tests/shell/test_helper_lifecycle.py::test_one_blocked_helper_per_context_after_lock' 'tests/shell/test_collector_lifecycle.py::test_n_prompts_leave_zero_zombies_including_killed_children' --basetemp="$RUNNER_TEMP/helper-lifetime-pytest" -q -rA -p no:cacheprovider | tee "$RUNNER_TEMP/helper-lifetime.txt"
          grep -Fx 'PASSED tests/shell/test_helper_lifecycle.py::test_helper_requests_kill_after_deadline_on_normal_and_blocked_mount[normal]' "$RUNNER_TEMP/helper-lifetime.txt"
          grep -Fx 'PASSED tests/shell/test_helper_lifecycle.py::test_helper_requests_kill_after_deadline_on_normal_and_blocked_mount[blocked-mount]' "$RUNNER_TEMP/helper-lifetime.txt"
          grep -Fx 'PASSED tests/shell/test_helper_lifecycle.py::test_one_blocked_helper_per_context_after_lock' "$RUNNER_TEMP/helper-lifetime.txt"
          grep -Fx 'PASSED tests/shell/test_collector_lifecycle.py::test_n_prompts_leave_zero_zombies_including_killed_children' "$RUNNER_TEMP/helper-lifetime.txt"
      # GATE-FDS.1/.2 and GATE-HELPER-LIFETIME.2 on a release build: a real
      # bash holds pipe write ends at fds 3-9 and 1025 without CLOEXEC. The EOF
      # case stops a bindfs daemon; a host that cannot mount FUSE fails with
      # BLOCKED instead of skipping.
      # 이것을 실패시키는 것: debug 칸에서 돌리거나 시험 하나의 PASSED 단언을 빼는 것.
      - name: Descriptors the front and helper pass on (release)
        if: matrix.profile == 'release'
        run: |
          set -o pipefail
          "$RUNNER_TEMP/venv/bin/python" -m pytest 'tests/shell/test_prompt_env_paths.py::test_live_helper_execs_with_only_dev_null_stdio' 'tests/shell/test_prompt_env_paths.py::test_live_collector_holds_only_fixed_fds' 'tests/shell/test_prompt_env_paths.py::test_shell_pipe_reaches_eof_while_helper_is_alive' --basetemp="$RUNNER_TEMP/fd-pytest" -q -rA -p no:cacheprovider | tee "$RUNNER_TEMP/fds.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_helper_execs_with_only_dev_null_stdio' "$RUNNER_TEMP/fds.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_collector_holds_only_fixed_fds' "$RUNNER_TEMP/fds.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_shell_pipe_reaches_eof_while_helper_is_alive' "$RUNNER_TEMP/fds.txt"
      # The path allowlist with exactly one collecting collector needs a release
      # helper (a debug one under strace often defers admission); the PTY
      # containers run the no-collection cell on their debug build.
      # 이것을 실패시키는 것: 이 단계를 debug 칸에서 돌리거나 매개변수 하나의 PASSED 단언을 빼는 것.
      - name: Prompt path allowlist with one collector (release)
        if: matrix.profile == 'release'
        run: |
          set -o pipefail
          "$RUNNER_TEMP/venv/bin/python" -m pytest 'tests/shell/test_prompt_env_paths.py::test_prompt_binary_names_only_allowed_system_paths_and_pinned_roots[global-missing]' 'tests/shell/test_prompt_env_paths.py::test_prompt_binary_names_only_allowed_system_paths_and_pinned_roots[global-present]' --basetemp="$RUNNER_TEMP/allowlist-pytest" -q -rA -p no:cacheprovider | tee "$RUNNER_TEMP/allowlist.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_prompt_binary_names_only_allowed_system_paths_and_pinned_roots[global-missing]' "$RUNNER_TEMP/allowlist.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_prompt_binary_names_only_allowed_system_paths_and_pinned_roots[global-present]' "$RUNNER_TEMP/allowlist.txt"
      - name: Build runtime path example test (release)
        if: matrix.profile == 'release'
        run: |
          set -o pipefail
          args=(--release)
          if [ "$LIBC" = musl ]; then args+=(--target "$(uname -m)-unknown-linux-musl"); fi
          cargo test -p bingsu --test cli_prompt --no-run "${args[@]}"
      # init warns about an executable path under sticky /tmp, so the fixtures live
      # under RUNNER_TEMP; a failure uploads them with the helper stage evidence.
      - name: Runtime root gates (release)
        if: matrix.profile == 'release'
        run: |
          set -o pipefail
          "$RUNNER_TEMP/venv/bin/python" -m pytest tests/shell/test_runtime_root_gate.py::test_deleted_and_recreated_runtime_root_degrades_every_prompt tests/shell/test_runtime_root_gate.py::test_init_again_recovers_runtime_root tests/shell/test_runtime_root_gate.py::test_runtime_root_path_examples --basetemp="$RUNNER_TEMP/helper-stage-pytest/helper-stage-evidence/runtime-root" -q -rA -p no:cacheprovider | tee "$RUNNER_TEMP/runtime-root.txt"
          grep -Fx 'PASSED tests/shell/test_runtime_root_gate.py::test_deleted_and_recreated_runtime_root_degrades_every_prompt' "$RUNNER_TEMP/runtime-root.txt"
          grep -Fx 'PASSED tests/shell/test_runtime_root_gate.py::test_init_again_recovers_runtime_root' "$RUNNER_TEMP/runtime-root.txt"
          grep -Fx 'PASSED tests/shell/test_runtime_root_gate.py::test_runtime_root_path_examples' "$RUNNER_TEMP/runtime-root.txt"
      # GATE-TRUST-REVOKE.2 on a release build: the config root's FUSE daemon is stopped
      # and the test waits out T (about 60 s) on CLOCK_BOOTTIME. Without FUSE it fails BLOCKED.
      # 이것을 실패시키는 것: 막힌 마운트 신뢰 철회 시험을 빼거나 PASSED 단언 없이 돌리는 것.
      - name: Trust revocation past T on a blocked mount (release)
        if: matrix.profile == 'release'
        run: |
          set -o pipefail
          "$RUNNER_TEMP/venv/bin/python" -m pytest 'tests/shell/test_snapshot_refresh.py::test_chmod_g_w_on_blocked_mount_approves_no_unit_past_t' --basetemp="$RUNNER_TEMP/trust-revoke-pytest" -q -rA -p no:cacheprovider | tee "$RUNNER_TEMP/trust-revoke.txt"
          grep -Fx 'PASSED tests/shell/test_snapshot_refresh.py::test_chmod_g_w_on_blocked_mount_approves_no_unit_past_t' "$RUNNER_TEMP/trust-revoke.txt"
      # Only the live fixture's trace, stdout, stderr and attempt.json.
      - name: Upload failed helper stage evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helper-stage-${{ matrix.os }}-${{ matrix.libc }}-${{ matrix.profile }}
          path: ${{ runner.temp }}/helper-stage-pytest/helper-stage-evidence/
          retention-days: 2
          if-no-files-found: ignore
      - name: Mounted procfs self with a different visible PID
        if: matrix.libc == 'gnu' && matrix.profile == 'debug'
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m pytest tests/shell/test_prompt_proc.py -q -rs -p no:cacheprovider | tee "$RUNNER_TEMP/proc-pytest.out"
          grep -q '1 passed' "$RUNNER_TEMP/proc-pytest.out"

      - name: Previous-response path/facts/chunk gate on native Linux
        if: matrix.libc == 'gnu' && matrix.profile == 'debug'
        run: |
          set -o pipefail
          "$RUNNER_TEMP/venv/bin/python" -m pytest tests/shell/test_collector_response.py -k post_filter_has_no_new_path_or_metadata_effects -q -rA -p no:cacheprovider | tee "$RUNNER_TEMP/collection-reader.txt"
          for mode in absent current previous corrupt; do
            for length in 1 3841 65536; do
              grep -F "PASSED tests/shell/test_collector_response.py::test_post_filter_has_no_new_path_or_metadata_effects[$mode-$length]" "$RUNNER_TEMP/collection-reader.txt"
            done
          done

  b1-children:
    name: Child counts (${{ matrix.os }} ${{ matrix.libc }} release)
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        libc: [gnu, musl]
    env:
      PROFILE: release
      LIBC: ${{ matrix.libc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Build release siblings
        run: |
          arch=$(uname -m)
          target="$arch-unknown-linux-$LIBC"
          rustup target add "$target"
          if [ "$LIBC" = musl ]; then sudo apt-get update -q; sudo apt-get install -y musl-tools; fi
          cargo build -p bingsu -p bingsu-collect --release --target "$target"
          echo "BINGSU_BIN=$PWD/target/$target/release/bingsu" >> "$GITHUB_ENV"
      - name: Prepare tracing and Python
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends strace
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --require-hashes --only-binary=:all: -r tests/shell/requirements.txt
      # 이것을 실패시키는 것: release live 시험 생략·skip을 PASS로 세는 것.
      - name: Assert B1 release child gates
        run: |
          set -o pipefail
          "$RUNNER_TEMP/venv/bin/python" -m pytest tests/shell/test_prompt_env_paths.py::test_live_child_count_is_bounded_per_role tests/shell/test_prompt_env_paths.py::test_live_no_worker_segment_spawns_zero_collectors tests/shell/test_prompt_env_paths.py::test_live_collector_count_ignores_marker_validity tests/shell/test_prompt_env_paths.py::test_live_collector_spawns_after_helper_header_and_marker_reads --basetemp="$RUNNER_TEMP/b1-evidence" -q -rA -p no:cacheprovider | tee "$RUNNER_TEMP/b1.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_child_count_is_bounded_per_role' "$RUNNER_TEMP/b1.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_no_worker_segment_spawns_zero_collectors' "$RUNNER_TEMP/b1.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_collector_count_ignores_marker_validity' "$RUNNER_TEMP/b1.txt"
          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_live_collector_spawns_after_helper_header_and_marker_reads' "$RUNNER_TEMP/b1.txt"
      # 이것을 실패시키는 것: 무효 표식의 Eligibility::units() 단언을 CI에서 생략하는 것.
      - name: Assert invalid marker eligibility
        run: |
          set -o pipefail
          cargo test -p bingsu-core --lib --release | tee "$RUNNER_TEMP/b1-core.txt"
          grep -Fx 'test front::staged::tests::cases::n7_builtin_collection_survives_invalid_marker ... ok' "$RUNNER_TEMP/b1-core.txt"
          grep -Fx 'test front::staged::tests::cases::finish_refuses_permit_when_final_clock_reaches_deadline ... ok' "$RUNNER_TEMP/b1-core.txt"
          grep -Fx 'test front::staged::tests::cases::staged_plan_emits_fixed_clock_operations_per_path ... ok' "$RUNNER_TEMP/b1-core.txt"
      - name: Retain B1 failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: b1-${{ matrix.os }}-${{ matrix.libc }}
          path: |
            ${{ runner.temp }}/b1-evidence
            ${{ runner.temp }}/b1.txt

  shell-macos:
    name: Shell PTY (macOS Homebrew)
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: brew install bash fish
      # One interpreter for every step: a venv with the hash-pinned test
      # dependencies, and the Homebrew shells first in PATH.
      - name: Set up the test environment
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --require-hashes --only-binary=:all: -r tests/shell/requirements.txt
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "BINGSU_PY=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"
      - run: cargo build -p bingsu -p bingsu-collect
      - name: Generate shape-only init fixture
        run: |
          cargo test -j 2 -p bingsu --bin bingsu --test collection_reader --test cli_prompt --no-run
          fixture=$(mktemp -d "$PWD/target/shape-only-fixture.XXXXXX")
          M3A_FIXTURE_DIR="$fixture" M3A_FIXTURE_ROOT="$fixture" \
            cargo test -j 2 -p bingsu --bin bingsu commands::init::tests::write_shape_only_shell_fixture -- --exact --ignored --test-threads=1
          echo "BINGSU_SHAPE_ONLY_FIXTURE=$fixture" >> "$GITHUB_ENV"
      - name: Record shell versions
        run: |
          { echo "### macOS shell versions"; echo; echo '```'; "$BINGSU_PY" tests/shell/check_versions.py --record; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # BINGSU_PY (set above through GITHUB_ENV) makes run-all.sh use the venv.
      - name: Record golden vectors
        run: SHELLS="bash zsh fish" LOCALES="en_US.UTF-8 C ko_KR.UTF-8" tests/golden/record/run-all.sh
      # 이것을 실패시키는 것: 필수 job에서 게이트 행 표의 검사를 빼거나 그 skip을 통과로 세는 것.
      - name: Gate acceptance rows map every clause to a CI-asserted test
        run: |
          set -o pipefail
          "$RUNNER_TEMP/venv/bin/python" -m pytest tests/shell/test_gate_acceptance.py -q -rA -p no:cacheprovider | tee "$RUNNER_TEMP/gate-acceptance.txt"
          grep -Fx 'PASSED tests/shell/test_gate_acceptance.py::test_gate_rows_exist_and_run_in_ci' "$RUNNER_TEMP/gate-acceptance.txt"
          grep -Fx 'PASSED tests/shell/test_gate_acceptance.py::test_every_gate_clause_is_a_row_or_pending' "$RUNNER_TEMP/gate-acceptance.txt"
      - name: PTY tests
        if: success() || failure()
        env:
          BINGSU_TEST_LOCALE: en_US.UTF-8
          BINGSU_TEST_SHELLS: zsh bash fish
        # Exclude M3b security for this unprepared debug pair. ci.yml's native
        # macOS collector job prepares its release siblings and runs the file.
        run: '"$BINGSU_PY" -m pytest tests/shell tests/golden/record/test_overrides.py tests/golden/record/test_mixed_versions.py -q -rf -p no:cacheprovider --ignore tests/shell/test_collector_no_spawn_macos.py --ignore tests/shell/test_collector_security.py ${BINGSU_RECORD_OBSERVATIONS:+-s}'
