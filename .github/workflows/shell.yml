          grep -Fx 'PASSED tests/shell/test_command_round.py::test_macos_group_grandchild_ends_when_the_helper_dies' "$RUNNER_TEMP/command-round.txt"
          grep -Fx 'PASSED tests/shell/test_command_round.py::test_macos_group_grandchild_ends_with_the_round' "$RUNNER_TEMP/command-round.txt"
          grep -Fx 'PASSED tests/shell/test_command_round.py::test_no_session_runs_nothing_and_says_so' "$RUNNER_TEMP/command-round.txt"
          grep -Fx 'PASSED tests/shell/test_command_round.py::test_command_table_names_real_tests' "$RUNNER_TEMP/command-round.txt"
          grep -Fx 'PASSED tests/shell/test_command_round.py::test_rounds_until_waits_for_the_value' "$RUNNER_TEMP/command-round.txt"
          grep -Fx 'PASSED tests/shell/test_command_round.py::test_command_session_runs_the_collection' "$RUNNER_TEMP/command-round.txt"
          grep -Fx 'PASSED tests/shell/test_command_round.py::test_supervised_rounds_counts_rounds_that_ran_the_units' "$RUNNER_TEMP/command-round.txt"
          grep -Fx 'PASSED tests/shell/test_command_round.py::test_round_without_units_starts_no_supervisor' "$RUNNER_TEMP/command-round.txt"
          grep -Fx 'PASSED tests/shell/test_command_round.py::test_cache_hit_runs_nothing' "$RUNNER_TEMP/command-round.txt"
          grep -Fx 'PASSED tests/shell/test_command_round.py::test_no_cache_runs_every_round' "$RUNNER_TEMP/command-round.txt"
          grep -Fx 'PASSED tests/shell/test_command_round.py::test_failure_cached_10s' "$RUNNER_TEMP/command-round.txt"
          grep -Fx 'PASSED tests/shell/test_command_round.py::test_cache_hit_is_display_match' "$RUNNER_TEMP/command-round.txt"
          grep -Fx 'PASSED tests/shell/test_command_round.py::test_round_robin_reaches_every_unit' "$RUNNER_TEMP/command-round.txt"
          grep -Fx 'PASSED tests/shell/test_command_round.py::test_unresolved_units_do_not_hold_the_round' "$RUNNER_TEMP/command-round.txt"
          grep -Fx 'PASSED tests/shell/test_command_round.py::test_oversize_units_do_not_hold_the_round' "$RUNNER_TEMP/command-round.txt"
          grep -Fx 'PASSED tests/shell/test_command_round.py::test_command_only_rounds_reclaim_the_store_budget' "$RUNNER_TEMP/command-round.txt"
          grep -Fx 'PASSED tests/shell/test_command_round.py::test_command_value_is_drawn_for_its_own_shell' "$RUNNER_TEMP/command-round.txt"
          grep -Fx 'PASSED tests/shell/test_command_round.py::test_command_value_is_shared_across_terminals[False]' "$RUNNER_TEMP/command-round.txt"
          grep -Fx 'PASSED tests/shell/test_command_round.py::test_command_value_is_shared_across_terminals[True]' "$RUNNER_TEMP/command-round.txt"
          grep -Fx 'PASSED tests/shell/test_command_round.py::test_match_picks_the_published_value' "$RUNNER_TEMP/command-round.txt"
          grep -Fx 'PASSED tests/shell/test_command_round.py::test_match_only_change_reapplies_without_exec[False-False]' "$RUNNER_TEMP/command-round.txt"
          grep -Fx 'PASSED tests/shell/test_command_round.py::test_match_only_change_reapplies_without_exec[False-True]' "$RUNNER_TEMP/command-round.txt"
          grep -Fx 'PASSED tests/shell/test_command_round.py::test_match_only_change_reapplies_without_exec[True-False]' "$RUNNER_TEMP/command-round.txt"
          grep -Fx 'PASSED tests/shell/test_command_round.py::test_match_only_change_reapplies_without_exec[True-True]' "$RUNNER_TEMP/command-round.txt"
          grep -Fx 'PASSED tests/shell/test_command_round.py::test_match_size_limit_rejected_at_compile' "$RUNNER_TEMP/command-round.txt"
      - name: Fetch the pinned oh-my-zsh
        # As the PTY step: a failed step before it must not leave the tree out.
        if: success() || failure()
        run: |
          read -r commit < tests/shell/ohmyzsh.pin
          # The Rust cache can restore this folder from an earlier run.
          rm -rf target/ohmyzsh
          git init -q target/ohmyzsh
          for _ in 1 2 3; do
            git -C target/ohmyzsh fetch -q --depth 1 https://github.com/ohmyzsh/ohmyzsh.git "$commit" && break
            sleep 5
          done
          { git -C target/ohmyzsh checkout -q --detach FETCH_HEAD &&
            [ "$(git -C target/ohmyzsh rev-parse HEAD)" = "$commit" ]; } ||
            echo "::warning::oh-my-zsh fetch failed; its tests fail as BLOCKED"
      - name: PTY tests
        if: success() || failure()
        env:
          BINGSU_TEST_LOCALE: en_US.UTF-8
          BINGSU_TEST_SHELLS: zsh
        # Exclude M3b security for this unprepared debug pair. ci.yml's native
        # macOS collector job prepares its release siblings and runs the file.
        # tmux is a Linux image row: this job installs none, and the test
        # fails as BLOCKED without it.
        run: '"$BINGSU_PY" -m pytest tests/shell tests/golden/record/test_overrides.py tests/golden/record/test_mixed_versions.py -q -rf -p no:cacheprovider --ignore tests/shell/test_collector_no_spawn_macos.py --ignore tests/shell/test_collector_security.py --ignore tests/shell/test_gate_acceptance.py --ignore tests/shell/test_prompt_trace_budget.py --ignore tests/shell/test_command_round.py --ignore tests/shell/test_builtin_round.py --ignore tests/shell/test_command_cgroup.py --durations=0 --durations-min=0.1 --deselect tests/shell/test_zsh_screen.py::test_prompt_inside_tmux ${BINGSU_RECORD_OBSERVATIONS:+-s}'

  shell-macos-shells:
    name: Shell PTY (macOS Homebrew ${{ matrix.shell }})
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shell: [bash, fish]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: brew install bash fish
      # One interpreter for every step: a venv with the hash-pinned test
      # dependencies, and the Homebrew shells first in PATH.
      - name: Set up the test environment
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --require-hashes --only-binary=:all: -r tests/shell/requirements.txt
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "BINGSU_PY=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"
      - run: cargo build -p bingsu -p bingsu-prompt -p bingsu-collect -p bingsu-bench --bin bingsu --bin bingsu-prompt --bin bingsu-collect --bin version-stub
      - name: Generate shape-only init fixture
        run: |
          cargo test -j 2 -p bingsu --bin bingsu --test collection_reader --test cli_prompt --no-run
          fixture=$(mktemp -d "$PWD/target/shape-only-fixture.XXXXXX")
          M3A_FIXTURE_DIR="$fixture" M3A_FIXTURE_ROOT="$fixture" \
            cargo test -j 2 -p bingsu --bin bingsu commands::init::tests::write_shape_only_shell_fixture -- --exact --ignored --test-threads=1
          echo "BINGSU_SHAPE_ONLY_FIXTURE=$fixture" >> "$GITHUB_ENV"
      - name: Record shell versions
        run: |
          { echo "### macOS shell versions"; echo; echo '```'; "$BINGSU_PY" tests/shell/check_versions.py --record; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # BINGSU_PY (set above through GITHUB_ENV) makes run-all.sh use the venv.
      - name: Record golden vectors
        run: SHELLS="${{ matrix.shell }}" LOCALES="en_US.UTF-8 C ko_KR.UTF-8" tests/golden/record/run-all.sh
      - name: Fetch the pinned oh-my-zsh
        # As the PTY step: a failed step before it must not leave the tree out.
        if: success() || failure()
        run: |
          read -r commit < tests/shell/ohmyzsh.pin
          # The Rust cache can restore this folder from an earlier run.
          rm -rf target/ohmyzsh
          git init -q target/ohmyzsh
          for _ in 1 2 3; do
            git -C target/ohmyzsh fetch -q --depth 1 https://github.com/ohmyzsh/ohmyzsh.git "$commit" && break
            sleep 5
          done
          { git -C target/ohmyzsh checkout -q --detach FETCH_HEAD &&
            [ "$(git -C target/ohmyzsh rev-parse HEAD)" = "$commit" ]; } ||
            echo "::warning::oh-my-zsh fetch failed; its tests fail as BLOCKED"
      - name: PTY tests
        if: success() || failure()
        env:
          BINGSU_TEST_LOCALE: en_US.UTF-8
          BINGSU_TEST_SHELLS: ${{ matrix.shell }}
        # Exclude M3b security for this unprepared debug pair. ci.yml's native
        # macOS collector job prepares its release siblings and runs the file.
        # tmux is a Linux image row: this job installs none, and the test
        # fails as BLOCKED without it.
        run: '"$BINGSU_PY" -m pytest tests/shell tests/golden/record/test_overrides.py tests/golden/record/test_mixed_versions.py -q -rf -p no:cacheprovider --ignore tests/shell/test_collector_no_spawn_macos.py --ignore tests/shell/test_collector_security.py --ignore tests/shell/test_gate_acceptance.py --ignore tests/shell/test_prompt_trace_budget.py --ignore tests/shell/test_command_round.py --ignore tests/shell/test_builtin_round.py --ignore tests/shell/test_command_cgroup.py --durations=0 --durations-min=0.1 --deselect tests/shell/test_zsh_screen.py::test_prompt_inside_tmux ${BINGSU_RECORD_OBSERVATIONS:+-s}'
