name: Shell

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shell-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The PTY tests need the bingsu binary; without a Cargo workspace there is
  # nothing to test (same detect step as ci.yml).
  detect:
    name: Detect project
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.check.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: |
          if [ -f Cargo.toml ]; then echo "rust=true" >> "$GITHUB_OUTPUT"; else echo "rust=false" >> "$GITHUB_OUTPUT"; fi

  shell-linux:
    name: Shell PTY (${{ matrix.image }})
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: min-u22
            versions: bash=5.1 zsh=5.8
            shells: bash zsh
          - image: min-d12
            versions: fish=3.6
            shells: fish
          - image: cur-d13
            versions: ""
            shells: bash zsh fish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Static musl binary: the runner's glibc is newer than the images'.
      - run: cargo build -p bingsu --target x86_64-unknown-linux-musl
      - run: tests/shell/containers/check-digests.sh
      - run: docker build -f "tests/shell/containers/${{ matrix.image }}.Dockerfile" -t "bingsu-${{ matrix.image }}" tests/shell/containers
      - name: Assert minimum versions
        if: matrix.versions != ''
        run: docker run --rm -v "$PWD:/w" -w /w "bingsu-${{ matrix.image }}" python3 tests/shell/check_versions.py ${{ matrix.versions }}
      - name: Record shell versions
        run: |
          { echo "### ${{ matrix.image }} shell versions"; echo; echo '```'
            docker run --rm -v "$PWD:/w" -w /w "bingsu-${{ matrix.image }}" python3 tests/shell/check_versions.py --record
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Record golden vectors
        run: |
          docker run --rm -v "$PWD:/w" -w /w -e SHELLS="${{ matrix.shells }}" -e LOCALES="C.UTF-8 C ko_KR.UTF-8" \
            "bingsu-${{ matrix.image }}" tests/golden/record/run-all.sh
      - name: PTY tests
        run: |
          # While recording (Task A12), -s shows the OBSERVE lines in the job log.
          docker run --rm --cap-add SYS_PTRACE -v "$PWD:/w" -w /w \
            -e BINGSU_BIN=/w/target/x86_64-unknown-linux-musl/debug/bingsu \
            -e BINGSU_TEST_SHELLS="${{ matrix.shells }}" -e BINGSU_RECORD_OBSERVATIONS -e LC_ALL=C.UTF-8 \
            "bingsu-${{ matrix.image }}" python3 -m pytest tests/shell -q -rf -p no:cacheprovider ${BINGSU_RECORD_OBSERVATIONS:+-s}

  shell-macos:
    name: Shell PTY (macOS Homebrew)
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: brew install bash fish
      - run: 'python3 -m pip install --user --break-system-packages --require-hashes --only-binary=:all: -r tests/shell/requirements.txt'  # quoted: a bare ':all: ' is a YAML mapping
      - run: cargo build -p bingsu
      - name: Record shell versions
        run: |
          PATH="$(brew --prefix)/bin:$PATH"
          export PATH
          { echo "### macOS shell versions"; echo; echo '```'; python3 tests/shell/check_versions.py --record; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Golden and PTY tests
        run: |
          PATH="$(brew --prefix)/bin:$PATH"
          export PATH BINGSU_TEST_LOCALE=en_US.UTF-8
          SHELLS="bash zsh fish" LOCALES="en_US.UTF-8 C ko_KR.UTF-8" tests/golden/record/run-all.sh
          BINGSU_TEST_SHELLS="zsh bash fish" python3 -m pytest tests/shell -q -rf -p no:cacheprovider ${BINGSU_RECORD_OBSERVATIONS:+-s}
