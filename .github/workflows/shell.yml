          grep -Fx 'PASSED tests/shell/test_prompt_env_paths.py::test_helper_e_n_cap_matches_product_constant' "$RUNNER_TEMP/axis-cap.txt"
      # B exactly at the cap through a real reload: about 500 ms on a debug build,
      # so that cell measures the work budget there and is ignored outside release.
      # 이것을 실패시키는 것: 이 단계를 빼거나 시험을 release에서도 ignore하는 것(ok 줄이 없어 grep이 실패).
      - name: Exact B cap through reload (release)
        if: matrix.profile == 'release'
        run: |
          set -o pipefail
          args=(--release)
          if [ "$LIBC" = musl ]; then args+=(--target "$(uname -m)-unknown-linux-musl"); fi
          cargo test -p bingsu --test helper_axis_caps "${args[@]}" | tee "$RUNNER_TEMP/b-cap.txt"
          grep -Fx 'test reload_publishes_at_exactly_the_b_cap ... ok' "$RUNNER_TEMP/b-cap.txt"
      # 짧은 읽기는 정규 파일의 strace로 만들 수 없어 앞단 계획 시험으로 고정한다. 코어는 libc에 닿지 않아 host target으로 돈다.
      # 이것을 실패시키는 것: 이 단계를 빼거나 debug 칸에서만 돌리거나 ok 단언을 빼는 것.
      - name: Front short reads keep the read limit (release)
        if: matrix.profile == 'release'
