          grep -Fx 'PASSED tests/shell/test_command_round.py::test_supervised_rounds_counts_rounds_that_ran_the_units' "$RUNNER_TEMP/command-round.txt"
      # GATE-FS-HELPER.2 on a release build: past an axis cap the helper's round ends
      # closed and no config source call follows the crossing.
      # 이것을 실패시키는 것: 이 단계를 빼거나 debug 칸에서만 돌리거나 PASSED 단언을 빼는 것.
