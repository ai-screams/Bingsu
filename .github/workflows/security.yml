name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 1" # every Monday 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Push and PR runs replace each other; a scheduled or dispatched run (the
# long fuzz job) has its own group and is never cancelled by a main push.
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full history
          persist-credentials: false
      - name: Install gitleaks (pinned release, checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${file}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${file}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check
          tar -xzf "${file}" gitleaks
      - name: Run gitleaks
        run: ./gitleaks git --redact --no-banner --verbose .

  audit:
    name: Dependency advisories (cargo-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: |
          if [ -f Cargo.lock ]; then echo "lock=true" >> "$GITHUB_OUTPUT"; else echo "lock=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.lock == 'true'
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit
      - if: steps.check.outputs.lock == 'true'
        run: cargo audit
      # The size probe's own lock (outside the workspace).
      - if: steps.check.outputs.lock == 'true'
        run: cargo audit --file bench/size-probe/Cargo.lock
      # Independent X-14 lock: absence is a failure until the lead supplies it.
      - if: steps.check.outputs.lock == 'true'
        run: cargo audit --file bench/probes/collector-x14/Cargo.lock
      # The collector fuzz crate's own lock (outside the workspace).
      - if: steps.check.outputs.lock == 'true'
        run: cargo audit --file fuzz/collector/Cargo.lock

  collector-contracts:
    name: Shipped collector CI contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare contract tests
        run: |
          python3 -m venv "$RUNNER_TEMP/contracts"
          "$RUNNER_TEMP/contracts/bin/python" -m pip install --require-hashes --only-binary=:all: -r tests/shell/requirements.txt
      # 이것을 실패시키는 것: 출하 심벌·exec 거부·실제 수집 셀을 required CI에서 제거하는 것.
      - name: Pin required real collection cells
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          "$RUNNER_TEMP/contracts/bin/python" -m pytest tests/shell/test_collector_security.py::test_real_collection_has_no_silent_skip -q -rA -p no:cacheprovider | tee "$RUNNER_TEMP/contracts.txt"
          grep -Fx 'PASSED tests/shell/test_collector_security.py::test_real_collection_has_no_silent_skip' "$RUNNER_TEMP/contracts.txt"

  # Long sanitizer fuzz of the collector's in-memory git parsers. The fixed
  # seeds replay on stable in every PR (ci.yml, F2 fixed fuzz seed regression
  # corpus); this job explores beyond them on a schedule or on request.
  fuzz:
    name: Collector parser fuzz (${{ matrix.target }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FUZZ_TOOLCHAIN: nightly-2026-09-15
      CARGO_FUZZ_VERSION: 0.13.2
    strategy:
      fail-fast: false
      matrix:
        target: [index, pack, config, attributes, ignore, refs, commit_objects, multi_pack_index, gitdir, commondir]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: nightly-2026-09-15
      - name: Install cargo-fuzz (exact version, locked)
        shell: bash --noprofile --norc -euo pipefail {0}
        run: cargo install --locked cargo-fuzz --version "=${CARGO_FUZZ_VERSION}"
      - name: Write the fixed seed corpus
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          cargo +"$FUZZ_TOOLCHAIN" fetch --locked --manifest-path fuzz/collector/Cargo.toml
          cargo +"$FUZZ_TOOLCHAIN" run --locked --manifest-path fuzz/collector/Cargo.toml --bin write-seeds -- "$RUNNER_TEMP/seeds"
      - name: Fuzz under AddressSanitizer with debug assertions
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "$RUNNER_TEMP/corpus/$TARGET" "$RUNNER_TEMP/artifacts/$TARGET"
          cargo +"$FUZZ_TOOLCHAIN" fuzz run --fuzz-dir fuzz/collector --features libfuzzer -O -a --sanitizer address "$TARGET" "$RUNNER_TEMP/corpus/$TARGET" "$RUNNER_TEMP/seeds/$TARGET" -- -max_total_time=900 -rss_limit_mb=2048 -timeout=10 -max_len=65536 -artifact_prefix="$RUNNER_TEMP/artifacts/$TARGET/"
      - name: Preserve crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: collector-fuzz-${{ matrix.target }}
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: warn
          retention-days: 2
