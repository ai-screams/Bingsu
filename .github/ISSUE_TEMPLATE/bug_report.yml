name: Bug report
description: Something in bingsu does not work as expected
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please search [existing issues](https://github.com/ai-screams/Bingsu/issues) first.
        For security problems, use a [private advisory](https://github.com/ai-screams/Bingsu/security/advisories/new) instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem. A screenshot helps a lot for anything visual.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Config
      description: The relevant part of your bingsu config. Remove anything private.
      render: toml

  - type: input
    id: version
    attributes:
      label: bingsu version
      placeholder: "bingsu --version"
    validations:
      required: true

  - type: dropdown
    id: shell
    attributes:
      label: Shell
      multiple: true
      options:
        - bash
        - zsh
        - fish
        - other
    validations:
      required: true

  - type: input
    id: shell-version
    attributes:
      label: Shell version
      placeholder: "zsh 5.9"

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows (WSL)
        - Windows (native)
        - other
    validations:
      required: true

  - type: input
    id: terminal
    attributes:
      label: Terminal and font
      description: Many display bugs depend on these.
      placeholder: "Ghostty 1.2, JetBrainsMono Nerd Font"

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
