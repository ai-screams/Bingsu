version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  # The size probe keeps its own lock outside the workspace.
  - package-ecosystem: cargo
    directory: /bench/size-probe
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
