[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "BSD-3-Clause", "Zlib", "ISC"]
confidence-threshold = 0.9

# uluru comes in only through gix's pack reading (gix-pack), which the git
# status path needs. MPL-2.0 is file-level copyleft and the crate is used
# unmodified, so it is allowed for this crate alone, not as a general license.
# No version is pinned: the lock already pins it, and a pinned version would
# fail the check on every uluru update for a license that did not change.
[[licenses.exceptions]]
crate = "uluru"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
