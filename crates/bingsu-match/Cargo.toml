[package]
name = "bingsu-match"
version = "0.0.0"
description = "Output parsing (`match`) of bingsu command segments: one check and one apply, outside the prompt path"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Standard regex with Unicode classes, no perf engines (C4c ruling Q6: the
# helper's worst round stays a few milliseconds, the binary about 0.85 MB
# smaller than with perf).
regex = { version = "=1.13.1", default-features = false, features = ["std", "unicode"] }
