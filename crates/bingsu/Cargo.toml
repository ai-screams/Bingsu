[package]
name = "bingsu"
version = "0.0.0"
description = "Cross-shell prompt engine"
publish = false
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Measurement-only hidden subcommand `__collect-stub` (M1 cost matrix).
bench-stubs = ["dep:bingsu-bench", "bingsu-identity/bench-build"]

[dependencies]
bingsu-core = { path = "../bingsu-core" }
bingsu-identity = { path = "../bingsu-identity" }
# `match` of command segments (C4c): regex in the CLI only, never in core.
bingsu-match = { path = "../bingsu-match" }
bingsu-bench = { path = "../bingsu-bench", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

# Trace the confined reader on the process main thread, as the product runs.
[[test]]
name = "collection_reader"
harness = false
