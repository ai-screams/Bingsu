[package]
name = "bingsu-collect"
version = "0.0.0"
description = "Dedicated bounded collection worker"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "bingsu-collect"
path = "src/main.rs"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies]
bingsu-core = { path = "../bingsu-core" }

[features]
# Identity only: a measurement build cannot pair with a shipped binary.
bench-build = []
