# Bans for bingsu-core's own dependency graph. Used with
#   cargo deny --manifest-path crates/bingsu-core/Cargo.toml --config crates/bingsu-core/deny.toml check bans
# These crates do I/O, spawn or bind the OS; a pure core must not depend on them.
[bans]
multiple-versions = "deny"
wildcards = "deny"
deny = [
  { crate = "libc" },
  { crate = "rustix" },
  { crate = "nix" },
  { crate = "tokio" },
  { crate = "mio" },
  { crate = "socket2" },
  { crate = "getrandom" },
  { crate = "rand" },
  { crate = "dirs" },
  { crate = "home" },
  { crate = "tempfile" },
  { crate = "walkdir" },
  { crate = "gix" },
]
