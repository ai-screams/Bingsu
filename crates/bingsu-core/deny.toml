# Bans for bingsu-core's own dependency graph. Used with
#   cargo deny --manifest-path crates/bingsu-core/Cargo.toml --config crates/bingsu-core/deny.toml check bans
# `allow` is an allowlist: any crate not listed is rejected (not-allowed).
# To add a dependency to core, review it first, then list it in `allow`.
# The `deny` list below stays as documentation of crates that do I/O, spawn
# or bind the OS; a pure core must not depend on them.
[bans]
multiple-versions = "deny"
wildcards = "deny"
allow = [
  { name = "bingsu-core" },
  { name = "libm" },
  { name = "unicode-segmentation" },
  # TOML for the config model (M3a S1): no_std + alloc, no build scripts.
  { name = "toml" },
  { name = "toml_parser" },
  { name = "toml_datetime" },
  { name = "serde_spanned" },
  { name = "winnow" },
]
deny = [
  { crate = "libc" },
  { crate = "rustix" },
  { crate = "nix" },
  { crate = "tokio" },
  { crate = "mio" },
  { crate = "socket2" },
  { crate = "getrandom" },
  { crate = "rand" },
  { crate = "dirs" },
  { crate = "home" },
  { crate = "tempfile" },
  { crate = "walkdir" },
  { crate = "gix" },
]

# Every crate of core's graph comes from crates.io; a git source or another
# registry is refused. Path crates are not sources to cargo-deny, so
# scripts/check_core_no_std.py pins the graph by version, source and
# feature set as well.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
