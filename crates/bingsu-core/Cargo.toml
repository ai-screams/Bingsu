[package]
name = "bingsu-core"
version = "0.0.0"
description = "I/O-free core of bingsu: record format, shell encoding, layout"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Lints are not inherited from the workspace so that the purity lints can be
# set to forbid here, in the manifest. Every root [workspace.lints] entry must
# appear here with the same value (scripts/check-core-purity.sh checks it).
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# Also #![forbid(unsafe_code)] in lib.rs; both are checked by the purity gate.
unsafe_code = "forbid"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# Purity rules (clippy.toml) can never be switched off inside the crate:
# forbid turns any inner allow/expect into a hard error (E0453).
disallowed_methods = "forbid"
disallowed_types = "forbid"
disallowed_macros = "forbid"
# A function's address cast to a number differs from run to run (ASLR).
fn_to_numeric_cast_any = "forbid"

[dependencies]
# Pure Rust math so native and wasm32 give the same bits (spec section 1,
# F-06). default-features = false drops the `arch` feature, which swaps in
# hardware sqrt and fma; those are exact anyway, but one code path is
# simpler to reason about.
libm = { version = "=0.2.16", default-features = false }
# Extended grapheme clusters for widths, Unicode 17.0.0
# (unicode_segmentation::UNICODE_VERSION); src/ucd.rs will be generated for
# the same version in Task A2 (test ucd_version_matches_segmentation).
unicode-segmentation = { version = "=1.13.3", default-features = false }
# TOML for the config model (M3a S1): the `parse` feature
# without `std` (no_std + alloc) gives spanned tables and recoverable
# errors; editing is a pure span splice in this crate (config::edit), so
# no std TOML editor joins the shipped graph (toml_edit would turn on std
# in toml_parser and winnow for core too: feature unification).
toml = { version = "=1.1.8", default-features = false, features = ["parse"] }
# Reuse the parser's recovered events for bounded preflight and first key spans.
# Already in toml's pinned no_std graph; no additional features or packages.
toml_parser = { version = "=1.1.5", default-features = false, features = ["alloc"] }
