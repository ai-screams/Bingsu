[workspace]
resolver = "3"
members = ["crates/bingsu-core", "crates/bingsu", "crates/bingsu-bench", "crates/bingsu-collect", "crates/bingsu-identity", "crates/bingsu-core-tests", "crates/bingsu-core-bench", "crates/bingsu-golden", "tools/core-cfg-check"]
exclude = ["crates/bingsu-core/purity-canary", "crates/bingsu/purity-canary", "bench/size-probe"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ai-screams/Bingsu"

[workspace.dependencies]
# Gitoxide 0.88 lower crates only. Staged counts use a bounded sorted merge;
# gix-diff's blob feature would pull filter/worktree/command into this graph.
gix-index = { version = "=0.56.0", default-features = false }
gix-pack = { version = "=0.75.0", default-features = false }
gix-error = { version = "=0.4.0", default-features = false }
gix-utils = { version = "=0.4.0", default-features = false }
gix-zlib = { version = "=0.2.0", default-features = false }
gix-object = { version = "=0.65.0", default-features = false, features = ["sha1"] }
gix-config = { version = "=0.61.0", default-features = false }
gix-ref = { version = "=0.68.0", default-features = false }
gix-ignore = { version = "=0.23.0", default-features = false }
gix-attributes = { version = "=0.36.0", default-features = false }
gix-revwalk = { version = "=0.36.0", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

# std's debug build checks that an fd is open (fcntl F_GETFD) on every
# OwnedFd drop; switched off so the synthetic strace program makes only its
# known calls. overflow-checks stay on. bingsu-bench only.
[profile.dev.package.bingsu-bench]
debug-assertions = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# panic = "abort" is intentionally absent: prompt must catch unwind panics
# and still print a minimal record (spec section 6).

# bench inherits release. The instruction-count gate turns collection on by
# function name, so a stripped bench binary counts 0 everywhere; keep the
# symbols, and line tables for annotating the Callgrind output. Changing
# this profile moves the counts (debuginfo alone shifts codegen), so a pull
# request that touches it is not compared like with like.
[profile.bench]
strip = false
debug = "line-tables-only"
